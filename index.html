    ed.hidden = n == null;
    if (n != null) {
      $('#macro-title').textContent = `M${n}`;
      del.dataset.delm = n; del.title = del.ariaLabel = `Delete M${n}`;
      if (!del.firstChild) del.innerHTML = TRASH_ICON;
    }
    const shape = n == null ? '' : n + ':' + edit.draft[n].map(s => s.t).join('') + '|' + JSON.stringify(mac.rec);
    if (box.dataset.shape === shape && box.firstChild) { renderMacroMeta(); return; }
    box.dataset.shape = shape;
    box.innerHTML = n == null
      ? ''
      : `<div class="macro" data-m="${n}">
        <div class="steps">${edit.draft[n].length ? edit.draft[n].map((s, i) => `<div class="step" data-step="${i}">
          <span class="grip" title="Drag to reorder">${GRIP}</span>
          <div class="step-body"><span class="step-type">${STEP_NAME[s.t]}</span>${stepBody(s, n, i)}</div>
          <button type="button" class="icon-btn" data-del="${i}" aria-label="Remove step">${X_ICON}</button></div>`).join('')
          : ''}</div>
        <div class="step-add"><button type="button" data-add="text">+ Type text</button><button type="button" data-add="key">+ Press key</button><button type="button" data-add="wait">+ Wait</button>
</div>
      </div>`;
    renderMacroMeta();
  }
  function stepsChanged(n) {
    if (edit.draft[n].length) mac.open.delete(n); else mac.open.add(n);   // emptied: stays as a tab until deleted
    renderMacros(); macroChanged();
  }

  function renderMacroMeta() {
    const used = macroBytesUsed(edit.draft), size = edit.macroSize, m = $('#macro-meter');
    m.hidden = !size;
    m.textContent = `${used} / ${size} bytes`;
    m.classList.toggle('over', used > size);
  }

  // events
  $('#layer-seg').addEventListener('click', e => { const b = e.target.closest('[data-layer]'); if (b) { edit.layer = +b.dataset.layer; renderKeymap(); } });
  $('#pick-cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { edit.cat = b.dataset.cat; edit.query = ''; $('#pick-search').value = ''; renderKeymap(); } });
  $('#pick-search').addEventListener('input', e => { edit.query = e.target.value; renderKeymap(); });
  $('#pick-mods').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (b) { edit.mods ^= +b.dataset.mod; renderKeymap(); } });
  $('#pick-keys').addEventListener('click', e => {
    const b = e.target.closest('[data-code]'); if (!b) return;
    const id = edit.ctrl;
    edit.mods = 0; pick(null);
    setCode(edit.layer, id, +b.dataset.code).then(() => flashFlag(id));
  });
  // Undo is ⌘Z / Ctrl+Z (when not typing in a field)
  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.code === 'KeyZ' && !inField(e) && panelsOpen() && edit.ready) { e.preventDefault(); undo(); }
  });
  $('#btn-restore').addEventListener('click', restoreOriginal);
  $('#btn-save-layout').addEventListener('click', saveLayoutFile);
  $('#btn-load-layout').addEventListener('click', () => $('#layout-file').click());
  $('#layout-file').addEventListener('change', e => { const f = e.target.files?.[0]; if (f) loadLayoutFile(f); e.target.value = ''; });
  // macro card: add, delete, edit and reorder steps; a Press step's keycap records the next key
  const macroAt = el => +el.closest('[data-m]').dataset.m;
  const stepIdx = el => +el.closest('[data-step]').dataset.step;
  function startRec(n, i) {
    if (edit.ctrl) pick(null);                                // one recorder at a time
    mac.rec = { n, i }; renderMacros();
  }
  function stopRec(keep = true) {
    const r = mac.rec; if (!r) return;
    mac.rec = null; macLonelyMod = null;
    if (!keep && !edit.draft[r.n][r.i]?.key) edit.draft[r.n].splice(r.i, 1);   // a new Press step left empty goes away
    stepsChanged(r.n);
  }
  $('#macro-tabs').addEventListener('click', e => {
    const t = e.target.closest('[data-sel]');
    if (t) { stopRec(false); mac.sel = +t.dataset.sel; renderMacros(); return; }
    if (e.target.closest('[data-newm]')) {
      const n = range(0, edit.macroCount - 1).find(i => !edit.draft[i]?.length && !mac.open.has(i));
      if (n == null) return;
      stopRec(false); mac.open.add(n); mac.sel = n; renderMacros();
    }
  });
  $('#macro-editor').addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if (add) {
      const n = macroAt(add), t = add.dataset.add, steps = edit.draft[n];
      steps.push(t === 'text' ? { t, v: '' } : t === 'wait' ? { t, ms: 100 } : { t, key: null, mods: [] });
      if (t === 'key') { mac.rec = { n, i: steps.length - 1 }; if (edit.ctrl) pick(null); }
      stepsChanged(n);
      if (t !== 'key') { const f = $(`.macro[data-m="${n}"] [data-step="${steps.length - 1}"] input`); f?.focus(); f?.select(); }
      return;
    }
    const rec = e.target.closest('[data-rec]');
    if (rec) { const n = macroAt(rec), i = stepIdx(rec); if (mac.rec?.n === n && mac.rec?.i === i) stopRec(false); else { stopRec(false); startRec(n, i); } return; }
    const del = e.target.closest('[data-del]');
    if (del) { const n = macroAt(del); if (mac.rec?.n === n) mac.rec = null; edit.draft[n].splice(stepIdx(del), 1); stepsChanged(n); return; }
    const delm = e.target.closest('[data-delm]');
    if (delm) {
      const n = +delm.dataset.delm, shown = shownMacros(), at = shown.indexOf(n);
      if (mac.rec?.n === n) mac.rec = null;
      edit.draft[n] = []; mac.open.delete(n);
      mac.sel = shown[at + 1] ?? shown[at - 1] ?? null;
      renderMacros(); macroChanged();
    }
  });
  // clicking anywhere else stops a recording
  document.addEventListener('mousedown', e => { if (mac.rec && !e.target.closest('[data-rec]')) stopRec(false); }, true);
  $('#macro-rows').addEventListener('input', e => {
    const f = e.target.dataset.field; if (!f) return;
    const st = edit.draft[macroAt(e.target)][stepIdx(e.target)];
    if (f === 'ms') { e.target.value = e.target.value.replace(/\D/g, ''); st.ms = Math.min(9999, parseInt(e.target.value, 10) || 0); }
    else st.v = e.target.value.replace(/[^\x20-\x7e]/g, '');   // the npad can only type plain ASCII
    renderMacroMeta(); macroChanged();
  });
  $('#macro-rows').addEventListener('keydown', e => {
    if (e.target.matches('.step-text, .step-ms') && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); e.target.blur(); }
  });
  // recording a Press step: the next key or shortcut; a modifier on its own records when released
  let macLonelyMod = null;
  const MOD_ORDER = [[1, 'KC_LCTL'], [4, 'KC_LALT'], [2, 'KC_LSFT'], [8, 'KC_LGUI']];
  window.addEventListener('keydown', e => {
    if (!mac.rec) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.repeat) return;
    if (e.key === 'Escape' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) { stopRec(false); return; }
    const kc = CODE_TO_KC[e.code];
    if (kc == null) { toast('That key can’t be recorded.'); return; }
    if (kc >= 0xe0) { macLonelyMod = e.code; return; }
    const st = edit.draft[mac.rec.n][mac.rec.i];
    const bits = (e.ctrlKey ? 1 : 0) | (e.shiftKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0);
    st.key = KC_NAME[kc];
    if (st.t === 'key') st.mods = kc <= 0xa4 ? MOD_ORDER.filter(([b]) => bits & b).map(([, m]) => m) : [];
    stopRec();
  }, true);
  window.addEventListener('keyup', e => {
    if (!mac.rec) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (macLonelyMod && e.code === macLonelyMod) {
      const st = edit.draft[mac.rec.n][mac.rec.i];
      st.key = KC_NAME[CODE_TO_KC[e.code]]; if (st.t === 'key') st.mods = [];
      stopRec();
    }
  }, true);
  // drag a step by its grip to reorder it within its macro
  let drag = null;
  $('#macro-rows').addEventListener('pointerdown', e => { const g = e.target.closest('.grip'); if (g) g.closest('.step').draggable = true; });
  $('#macro-rows').addEventListener('dragstart', e => {
    const row = e.target.closest?.('.step'); if (!row) return;
    drag = { n: macroAt(row), i: stepIdx(row) };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
    row.classList.add('dragging');
  });
  const dropAt = e => {
    const row = e.target.closest?.('.step');
    if (!drag || !row || macroAt(row) !== drag.n) return null;
    const r = row.getBoundingClientRect(), i = stepIdx(row);
    return { row, to: e.clientY > r.top + r.height / 2 ? i + 1 : i };
  };
  const clearMarks = () => $$('#macro-rows .drop-before, #macro-rows .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  $('#macro-rows').addEventListener('dragover', e => {
    const d = dropAt(e); if (!d) return;
    e.preventDefault(); clearMarks();
    d.row.classList.add(d.to > stepIdx(d.row) ? 'drop-after' : 'drop-before');
  });
  $('#macro-rows').addEventListener('drop', e => {
    const d = dropAt(e); if (!d) return;
    e.preventDefault();
    const steps = edit.draft[drag.n], [st] = steps.splice(drag.i, 1);
    steps.splice(d.to > drag.i ? d.to - 1 : d.to, 0, st);
    const n = drag.n; drag = null; clearMarks();
    $('#macro-rows').dataset.shape = ''; stepsChanged(n);
  });
  $('#macro-rows').addEventListener('dragend', e => {
    drag = null; clearMarks();
    $$('#macro-rows .step').forEach(r => { r.draggable = false; r.classList.remove('dragging'); });
  });
  render();
  autoConnect();                                  // an npad connected on an earlier visit reconnects by itself
})();
</script>
</body>
</html>
