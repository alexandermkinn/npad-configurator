<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Test every key and the knob on your npad macropad.">
<title>npad tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: device-first and centered. The npad is the page; a strip of status chips sits under it and the event log folds away below. */
/* A single dark look: the npad sits under a soft spotlight on a near-black stage. */
:root {
  color-scheme: dark;
  --bg: #0c0d10;
  --stage-hi: #22252d;
  --panel: #15171c;
  --fg: #e9ebf0;
  --muted: #959cab;
  --line: #262a33;
  --accent: #5b78ff;
  --ok: #4fd08a;
  --ok-soft: #133624;
  --warn: #f0b45a;
  --warn-soft: #3a2a10;
  /* flat fallback drawing of the device */
  --case: #1d1e22;
  --case-hi: #2a2c31;
  --cap: #2d2f35;
  --cap-hi: #3a3d44;
  --glow: #3d63ff;
  --glyph: #f2f3f5;
  --font-display: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
/* Layout: one screen, no page scroll. Top bar; the render fills the left; panels stack on the right. */
html, body { height: 100%; }
body { margin: 0; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
}
.app {
  height: 100%; display: grid; gap: 12px 0; padding: 14px 16px 16px;
  grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr);
}
.topbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* The sidebar opens by animating its width (the render resizes and the model glides to its new
   centre), while the panels inside slide in from the right one after another. */
.side { width: 356px; min-height: 0; overflow: hidden; display: flex; justify-content: flex-end;
  transition: width .5s cubic-bezier(.25, .8, .25, 1); }
.side-inner { width: 340px; flex: none; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
.side-inner > * { transition: transform .5s cubic-bezier(.2, .9, .25, 1), opacity .35s ease; }
.side-inner > :nth-child(n+2) { transition-delay: 60ms; }
.app.collapsed .side { width: 0; }
.app.collapsed .side-inner > * { transform: translateX(48px); opacity: 0; transition-delay: 0s; transition-duration: .3s; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-rows: auto minmax(0, 1fr) auto; }
  .side { width: auto; height: 46vh; padding-top: 12px; transition-property: height, padding; }
  .side-inner { width: 100%; }
  .app.collapsed .side { width: auto; height: 0; padding-top: 0; }
  .app.collapsed .side-inner > * { transform: translateY(32px); }
}
@media (prefers-reduced-motion: reduce) { .side, .side-inner > *, .side-tab .pane { transition: none !important; } }
button {
  font: inherit; font-weight: 500; font-size: 13px; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible, .cap:focus-visible, .knob-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
/* draws the eye to the connect button when someone tries to remap without an npad */
#btn-hid.nudge { animation: nudge .5s ease 2; }
@keyframes nudge { 50% { transform: scale(1.06); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { #btn-hid.nudge { animation: none; } }
/* short messages over the render: connection errors, browser support */
.toast {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3; margin: 0;
  width: max-content; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-size: 13px; text-align: center;
}
.toast[data-kind="warn"] { background: var(--warn-soft); border-color: transparent; color: var(--warn); }



/* ---------- the device ---------- */
.stage { position: relative; min-height: 0; display: grid; place-items: center; border-radius: 16px; overflow: hidden;
  background: radial-gradient(ellipse 55% 55% at 50% 50%, var(--stage-hi), transparent 75%); }
.npad {
  width: min(400px, 100%); position: relative;
  background: linear-gradient(160deg, var(--case-hi), var(--case) 45%);
  border-radius: 22px;
  box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 24px 40px -18px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.25);
  /* height comes from the knob and the key well, so nothing can spill out */
  display: flex; flex-direction: column; gap: 28px; padding: 36px 28px 30px; border-radius: 26px;
}
.cable { position: absolute; top: -26px; left: 50%; width: 22px; height: 30px; transform: translateX(-50%);
  background: var(--case); border-radius: 4px 4px 2px 2px; }
.knob-zone { display: grid; place-items: center; position: relative; padding-inline: 40px; }
.knob-btn { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 50%; width: min(190px, 100%); aspect-ratio: 1; display: grid; place-items: center; position: relative; }
.knob {
  width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #3a3c42, #1b1c20 70%);
  box-shadow: 0 0 0 5px #141518, 0 10px 18px rgba(0,0,0,.55), inset 0 2px 1px rgba(255,255,255,.07);
  transition: transform .18s cubic-bezier(.3,.7,.4,1);
  position: relative;
}
.knob::after { /* the finger dimple */
  content: ""; position: absolute; width: 24%; aspect-ratio: 1; border-radius: 50%;
  left: 50%; top: 9%; transform: translateX(-50%);
  background: radial-gradient(circle at 40% 35%, #2c2e33, #111214);
  box-shadow: inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05);
}
.knob-btn.down .knob { box-shadow: 0 0 0 5px #141518, 0 0 0 9px var(--glow), 0 4px 10px rgba(0,0,0,.5), inset 0 2px 1px rgba(255,255,255,.07); }
.turn { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 13px;
  color: var(--glyph); opacity: .18; transition: opacity .3s; display: grid; justify-items: center; gap: 2px; }
.turn svg { width: 22px; height: 22px; }
.turn.left { left: 0; } .turn.right { right: 0; }
.turn.flash { opacity: 1; transition: none; color: #9fb3ff; }
.turn .led, .knob-led { width: 6px; height: 6px; border-radius: 50%; background: #3b3e45; }
.turn .led.ok, .knob-led.ok { background: #4fd08a; box-shadow: 0 0 6px #4fd08a; }
.knob-led { position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%); }

.well {
  border-radius: 12px; padding: 10px;
  background: #0b0c10;
  box-shadow: 0 0 0 2px #23252b, 0 0 22px -2px rgba(61,99,255,.55), inset 0 0 18px rgba(61,99,255,.5);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
}
.cell { min-width: 0; border-radius: 6px; aspect-ratio: 1; display: grid; place-items: center;
  background: radial-gradient(circle, rgba(61,99,255,.55), rgba(61,99,255,.15) 70%); transition: background .25s; }
.cell.down { background: radial-gradient(circle, rgba(140,165,255,1), rgba(61,99,255,.7) 75%); transition: none; }
.cap {
  all: unset; box-sizing: border-box; cursor: pointer; position: relative;
  width: 86%; aspect-ratio: 1; border-radius: 7px;
  background: linear-gradient(180deg, var(--cap-hi), var(--cap));
  box-shadow: 0 3px 0 #17181c, 0 4px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  display: grid; place-items: center; color: var(--glyph);
  transition: transform .12s, box-shadow .12s;
}
.cap svg { width: 40%; height: 40%; }
.cap .n { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 8vw, 40px); line-height: 1; margin-top: -8%; }
.cell.down .cap { transform: translateY(3px); box-shadow: 0 0 0 #17181c, 0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.cap .led { position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: #474a52; }
.cap .led.ok { background: #4fd08a; box-shadow: 0 0 6px #4fd08a; }
.target .cap, .knob-btn.target { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px #9fb3ff; }
@media (prefers-reduced-motion: reduce) {
  .knob { transition: none; }
}
.npad3d { position: absolute; inset: 0; }
.npad3d canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
/* sidebar toggle in the top bar */
.side-tab { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
.side-tab:hover { color: var(--fg); }
.side-tab .pane { fill: currentColor; opacity: 0; transition: opacity .25s; }
.side-tab[aria-expanded="true"] { color: var(--fg); }
.side-tab[aria-expanded="true"] .pane { opacity: .55; }

/* ---------- status chips ---------- */
  all: unset; box-sizing: border-box; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  padding: 3px 10px; border-radius: 8px; border: 1px solid transparent; font-size: 13px;
}

/* ---------- sidebar tabs ---------- */
.tabpanel { display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1 1 auto; }
.muted { color: var(--muted); font-size: 12px; margin: 0; padding: 10px 14px; }

/* keymap */
.seg { display: flex; gap: 2px; }
.seg button, .mods button, .cats button, .macro-list button, .macro-add button { padding: 3px 9px; font-size: 12px; }
[aria-pressed="true"]:is(.seg button, .mods button, .cats button, .macro-list button, .key) { background: var(--accent); border-color: var(--accent); color: #fff; }
.panel.picker { flex: 1 1 0; min-height: 200px; display: flex; flex-direction: column; } /* fills what's left; its keys scroll */
.pick-current { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.pick-tools { display: flex; gap: 8px; padding: 8px 10px 0; }
.pick-tools input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
.mods { display: flex; gap: 2px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 4px; padding: 8px 10px 10px; overflow: auto; min-height: 0; flex: 1 1 auto; align-content: start; }
.key { padding: 6px 4px; font-size: 12px; line-height: 1.2; min-height: 34px; display: grid; place-items: center; text-align: center; word-break: break-word; }
.key small { display: block; font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
.key[aria-pressed="true"] small { color: #fff; }
button:disabled { opacity: .45; cursor: default; }

/* ---------- config mode: flags over the model, picker popover, layer/actions bar ---------- */
.flags, .flag-lines { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .25s; }
.flags.on, .flag-lines.on { opacity: 1; transition-delay: .2s; }
.flag-lines { width: 100%; height: 100%; overflow: visible; }
.flag-lines path { fill: none; stroke: color-mix(in srgb, var(--fg) 45%, transparent); stroke-width: 1; }
.flag-lines circle { fill: var(--fg); }
.flag-lines .sel path { stroke: var(--accent); }
.flag-lines .sel circle { fill: var(--accent); }
.flag { position: absolute; display: grid; gap: 1px; padding: 3px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0,0,0,.35); pointer-events: auto; }
.flags:not(.on) .flag { pointer-events: none; }
.flag-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 0; padding: 4px 6px; border-radius: 6px; min-width: 92px; max-width: 190px; }
.flag-row:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.flag-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.flag-row[aria-pressed="true"] { background: transparent; }
.flag-icon { transition: color .6s ease, filter .6s ease; }
.flag-icon.ok { color: color-mix(in srgb, var(--accent) 55%, #fff); }
.flag-row.hit .flag-icon { color: var(--accent); filter: drop-shadow(0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent)); transition: none; }
.flag-row { position: relative; }
.flag-row { grid-template-columns: auto minmax(0, 1fr) !important; align-items: center; column-gap: 8px !important; }
.flag-icon { display: grid; place-items: center; color: color-mix(in srgb, var(--fg) 70%, transparent); }
.flag-icon svg { display: block; }
.flag-row[aria-pressed="true"] .flag-icon { color: var(--accent); }
.flag-name { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.flag-code { /* the mapping is a key-capture field: click it, then press the key you want */
  position: relative; display: block; min-width: 88px; font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 4px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.35); transition: border-color .15s, background .15s; }
.flag-row:hover .flag-code { border-color: color-mix(in srgb, var(--fg) 30%, transparent); }
.flag-row[aria-pressed="true"] .flag-code { border-color: var(--accent); box-shadow: inset 0 1px 2px rgba(0,0,0,.35), 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); color: var(--fg); }
.flag-row.recording { cursor: default; grid-template-columns: auto minmax(0, 1fr) auto !important; }
.flag-row.recording .flag-code { color: var(--accent); font-family: var(--font-body); font-style: italic; border-color: var(--accent); overflow: visible; min-width: 104px;
  animation: rec-pulse 1.4s ease-in-out infinite; }
@keyframes rec-pulse { 50% { box-shadow: inset 0 1px 2px rgba(0,0,0,.35), 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); } }
@media (prefers-reduced-motion: reduce) { .flag-row.recording .flag-code { animation: none; } }
.flag-more { font-size: 11px; padding: 3px 7px; margin-left: 6px; border-radius: 6px; }
.flag-more[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.flag-row[aria-pressed="true"] .flag-name { color: color-mix(in srgb, #fff 75%, transparent); }
.popover { position: absolute; left: 0; top: 0; z-index: 4; width: 320px; max-width: calc(100% - 24px); height: min(430px, calc(100% - 24px));
  display: flex; flex-direction: column; filter: drop-shadow(0 12px 28px rgba(0,0,0,.5)); }
.popover .panel.picker { flex: 1 1 auto; min-height: 0; }

.layout-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 10px 10px; }
.layout-actions button { font-size: 12px; padding: 6px 8px; }
.layout-actions #btn-reset { grid-column: 1 / -1; }

/* macros */
.meter { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.meter.over { color: var(--warn); }
.macro-list { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 8px 10px 10px; }
.macro-list button { padding: 4px 0; font-family: var(--font-mono); }
.macro-list button.used:not([aria-pressed="true"]) { border-color: var(--muted); color: var(--fg); }
.panel.macro-editor { flex: 1 1 0; min-height: 160px; display: flex; flex-direction: column; }
.macro-state { font-size: 12px; color: var(--muted); }
.steps { display: grid; gap: 6px; padding: 8px 10px; overflow: auto; min-height: 0; flex: 1 1 auto; align-content: start; }
.step { display: grid; grid-template-columns: 74px minmax(0, 1fr) 24px; gap: 6px; align-items: center; }
.step-type { font-size: 12px; color: var(--muted); }
.step-body { display: flex; gap: 4px; align-items: center; min-width: 0; }
.step-body input, .step-body select { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 7px; }
.step-body input[type="number"] { max-width: 90px; }
.step-body .unit { font-size: 12px; color: var(--muted); }
.step .mods button { padding: 2px 6px; }
.step-del { padding: 0; width: 24px; height: 24px; line-height: 1; color: var(--muted); }
.macro-add { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 10px; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; flex: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--line); min-height: 36px; }
.panel h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel-head button { padding: 4px 10px; font-size: 12px; }
.panel-foot { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
.panel-foot button { flex: 1; padding: 5px 10px; font-size: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app collapsed">
  <header class="topbar">
    <h1>npad tester</h1>
    <div class="actions">
      <button id="btn-hid" type="button" class="primary">Connect npad</button>
      <button class="side-tab" id="btn-panels" type="button" hidden aria-controls="side" aria-expanded="false" aria-label="Show panels">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M14.5 4.5v15"/><rect class="pane" x="14.5" y="4.5" width="6.5" height="15" rx="0" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" aria-label="npad">
    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
    <svg class="flag-lines" id="flag-lines" aria-hidden="true"></svg>
    <div class="flags" id="flags" aria-label="What each control sends"></div>
    <div class="popover" id="popover" hidden>
      <section class="panel picker" aria-labelledby="pick-title">
        <div class="panel-head"><h2 id="pick-title">n key</h2><span class="pick-current" id="pick-current"></span></div>
        <div class="pick-tools">
          <input type="search" id="pick-search" placeholder="Search keys" aria-label="Search keys" autocomplete="off">
          <div class="mods" id="pick-mods" role="group" aria-label="Hold with">
            <button type="button" data-mod="1" title="Control">⌃</button><button type="button" data-mod="4" title="Option">⌥</button><button type="button" data-mod="2" title="Shift">⇧</button><button type="button" data-mod="8" title="Command">⌘</button>
          </div>
        </div>
        <div class="cats" id="pick-cats"></div>
        <div class="keys" id="pick-keys"></div>
      </section>
    </div>
    <div class="npad3d" id="npad3d" hidden aria-label="3D model of the npad. Drag to turn it; click a key to reassign it."></div>
    <div class="npad">
      <div class="cable" aria-hidden="true"></div>
      <div class="knob-zone">
        <div class="turn left" id="turn-ccw" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3v5h5"/></svg>
          <span class="led" data-led="ccw"></span>
        </div>
        <button class="knob-btn" id="knob" type="button" data-input="press" aria-label="Knob">
          <span class="knob" id="knob-face"></span>
          <span class="knob-led" data-led="press"></span>
        </button>
        <div class="turn right" id="turn-cw" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v5h-5"/></svg>
          <span class="led" data-led="cw"></span>
        </div>
      </div>
      <div class="well" id="well"></div>
    </div>
  </main>

  <aside class="side" id="side" inert>
   <div class="side-inner">
    <section class="panel" aria-labelledby="h-layout">
      <div class="panel-head"><h2 id="h-layout">Layer</h2><div class="seg" id="layer-seg" role="group" aria-label="Layer"></div></div>
      <div class="layout-actions">
        <button type="button" id="btn-undo" disabled>Undo</button>
        <button type="button" id="btn-restore" title="Put back what was on the npad when you connected">Restore</button>
        <button type="button" id="btn-save-layout" title="Download a VIA-compatible layout file">Save file</button>
        <button type="button" id="btn-load-layout" title="Load a VIA layout file onto the npad">Load file</button>
        <button type="button" id="btn-reset" title="Forget which controls have registered">Clear tested</button>
        <input type="file" id="layout-file" accept=".json,application/json" hidden>
      </div>
    </section>


    <div class="tabpanel" data-panel="macros">
      <section class="panel" aria-labelledby="h-macros">
        <div class="panel-head"><h2 id="h-macros">Macros</h2><span class="meter" id="macro-meter"></span></div>
        <div class="macro-list" id="macro-list"></div>
      </section>
      <section class="panel macro-editor" aria-labelledby="macro-title">
        <div class="panel-head"><h2 id="macro-title">Macro 0</h2><span class="macro-state" id="macro-state"></span></div>
        <div class="steps" id="macro-steps"></div>
        <div class="macro-add" id="macro-add">
          <button type="button" data-add="text">+ Text</button><button type="button" data-add="key">+ Key</button><button type="button" data-add="down">+ Hold</button><button type="button" data-add="up">+ Release</button><button type="button" data-add="wait">+ Wait</button>
        </div>
        <div class="panel-foot"><button type="button" id="macro-clear">Clear macro</button></div>
      </section>
    </div>
   </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 3D model of the npad (momokai Aurora). Units are millimetres, measured from
// momokai's product photos using the 19.05 mm key pitch as the scale.
window.initDevice3D = function (host, { pick, icons }) {
  if (!window.THREE) throw new Error('three.js did not load');
  const T = THREE;
  const W = 73, D = 98, H = 18, R = 5;                       // case
  // keycaps: 18.1 mm at the base on a 19.05 mm pitch, so neighbours sit about 1 mm apart
  const PITCH = 19.05, CAP_BASE = 18.1, CAP_Y = H - 2.5, TRAVEL = 3.5; // caps stand ~6.6 mm proud of the case
  // key pocket: caps span 56.2 × 37.2 mm, leaving about a 1 mm gap to the pocket wall
  const WELL_W = 58, WELL_D = 39, WELL_Z = 21, FLOOR = H - 10;
  const KNOB_R = 15.5, KNOB_H = 12.2, KNOB_Z = -20, KNOB_SINK = 3; // sits in a round recess, ~9.2 mm proud (from side photos)
  const srgb = hex => new T.Color(hex).convertSRGBToLinear();

  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  const scene = new T.Scene();

  // A small studio for the anodized aluminium to reflect.
  const pmrem = new T.PMREMGenerator(renderer);
  const studio = new T.Scene();
  studio.add(new T.Mesh(new T.BoxGeometry(100, 100, 100), new T.MeshBasicMaterial({ color: 0x24262c, side: T.BackSide })));
  const softbox = (w, h, x, y, z, c) => {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); studio.add(m);
  };
  softbox(70, 25, 0, 45, 5, 0xffffff);
  softbox(30, 40, -45, 15, 25, 0xc9d2ff);
  softbox(30, 30, 45, 10, -25, 0x9a9a9a);
  scene.environment = pmrem.fromScene(studio, 0.04).texture;

  scene.add(new T.HemisphereLight(0xe4e9ff, 0x0d0e12, 0.18));
  const sun = new T.DirectionalLight(0xffffff, 1.0);
  sun.position.set(-70, 170, 90);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 20, far: 450 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0008;
  sun.shadow.radius = 5;
  scene.add(sun);
  // The same light without shadows. Shifting intensity between the two fades every shadow in or out
  // smoothly (used by the exploded view) without changing how bright anything is.
  const sunFlat = new T.DirectionalLight(0xffffff, 0);
  sunFlat.position.copy(sun.position);
  scene.add(sunFlat);
  const SUN = sun.intensity, GROUND_SHADOW = 0.35;
  // low fill from the right so the sides (and the knob's knurl) aren't lost in shadow
  const fill = new T.DirectionalLight(0xdfe4ff, 0.45);
  fill.position.set(160, 50, 40);
  scene.add(fill);
  const rim = new T.DirectionalLight(0xcfd8ff, 0.6);
  rim.position.set(-40, 90, -220);
  scene.add(rim);

  const ground = new T.Mesh(new T.PlaneGeometry(800, 800), new T.ShadowMaterial({ opacity: 0.35 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2; // the npad stands on 2 mm rubber feet
  ground.receiveShadow = true;
  scene.add(ground);

  function roundRect(path, cx, cy, w, h, r) {
    const x = cx - w / 2, y = cy - h / 2;
    path.moveTo(x + r, y);
    path.lineTo(x + w - r, y); path.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
    path.lineTo(x + w, y + h - r); path.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    path.lineTo(x + r, y + h); path.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    path.lineTo(x, y + r); path.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    return path;
  }
  // Extrude a flat outline upward: shape x -> x, shape y -> -z, depth -> +y
  function extrudeUp(shape, height, bevel, segs = 3) {
    const g = new T.ExtrudeGeometry(shape, {
      depth: height - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
      bevelSegments: segs, curveSegments: 16,
    });
    g.rotateX(-Math.PI / 2);
    g.translate(0, bevel, 0);
    return g;
  }

  // ---- case ----
  // matte, bead-blasted black aluminium
  const aluminium = new T.MeshStandardMaterial({ color: srgb(0x1c1c1f), metalness: 0.25, roughness: 0.72, envMapIntensity: 0.6 });
  const PLATE = 1.4; // bottom plate, slightly inset, leaves a seam line
  const caseShape = roundRect(new T.Shape(), 0, 0, W - 1.6, D - 1.6, R);
  caseShape.holes.push(roundRect(new T.Path(), 0, -WELL_Z, WELL_W + 2, WELL_D + 2, 2.5));
  caseShape.holes.push(new T.Path().absarc(0, -KNOB_Z, KNOB_R + 1.6, 0, Math.PI * 2, true));
  const caseGeo = extrudeUp(caseShape, H - PLATE, 0.8, 1);
  caseGeo.translate(0, PLATE, 0);
  const caseMesh = new T.Mesh(caseGeo, aluminium);
  const plate = new T.Mesh(extrudeUp(roundRect(new T.Shape(), 0, 0, W - 2.6, D - 2.6, R - 0.5), PLATE - 0.15, 0.3, 1),
    new T.MeshStandardMaterial({ color: srgb(0x111113), metalness: 0.25, roughness: 0.8 }));
  [caseMesh, plate].forEach(m => { m.castShadow = m.receiveShadow = true; scene.add(m); });

  // four rubber feet under the corners, 2 mm tall
  const footGeo = new T.CylinderGeometry(3.6, 4, 2, 32);
  const footMat = new T.MeshStandardMaterial({ color: srgb(0x0e0e10), roughness: 0.95, metalness: 0 });
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const foot = new T.Mesh(footGeo, footMat);
    foot.position.set(sx * (W / 2 - 9), -1, sz * (D / 2 - 10));
    foot.castShadow = true;
    scene.add(foot);
  });

  // floor of the knob recess
  const recess = new T.Mesh(new T.CircleGeometry(KNOB_R + 1.6, 64), new T.MeshStandardMaterial({ color: srgb(0x050506), roughness: 1 }));
  recess.rotation.x = -Math.PI / 2;
  recess.position.set(0, FLOOR, KNOB_Z);                       // as deep as the key pocket
  scene.add(recess);

  // The rotary encoder the knob sits on (an EC11, simplified): a square steel body, a threaded
  // bushing and a knurled split shaft. Hidden under the knob when assembled; seen when it lifts off.
  const ENC = { body: 12.4, bodyH: 1.4, bushR: 3.5, bushH: 3, shaftR: 3, shaftH: 6.8 };
  // dark like the case, so it doesn't compete with the keycaps and knob
  const steel = new T.MeshStandardMaterial({ color: srgb(0x232327), metalness: 0.45, roughness: 0.55, envMapIntensity: 0.7 });
  const encoder = new T.Group();
  encoder.position.set(0, FLOOR, KNOB_Z);
  const encBody = new T.Mesh(new T.BoxGeometry(ENC.body, ENC.bodyH, ENC.body), steel);
  encBody.position.y = ENC.bodyH / 2;
  // threaded bushing: a stack of thin rings reads as a thread
  const bushing = new T.Group();
  for (let i = 0; i < 6; i++) {
    const ring = new T.Mesh(new T.CylinderGeometry(ENC.bushR - (i % 2) * 0.25, ENC.bushR - ((i + 1) % 2) * 0.25, ENC.bushH / 6, 40), steel);
    ring.position.y = ENC.bodyH + (i + 0.5) * ENC.bushH / 6;
    bushing.add(ring);
  }
  // knurled shaft (18 ridges) with the split slot across its top; it turns and dips with the knob
  const shaftGeo = new T.CylinderGeometry(ENC.shaftR, ENC.shaftR, ENC.shaftH, 18 * 4, 1);
  { const p = shaftGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), a = Math.atan2(z, x), k = 1 - 0.07 * (0.5 + 0.5 * Math.cos(a * 18));
      p.setX(i, x * k); p.setZ(i, z * k);
    }
    shaftGeo.computeVertexNormals(); }
  const shaft = new T.Group();
  const shaftMesh = new T.Mesh(shaftGeo, steel);
  shaftMesh.position.y = ENC.shaftH / 2;
  const slot = new T.Mesh(new T.BoxGeometry(ENC.shaftR * 2.02, 2.4, 0.8), new T.MeshBasicMaterial({ color: 0x050506 }));
  slot.position.y = ENC.shaftH - 1.15;
  shaft.add(shaftMesh, slot);
  shaft.position.y = ENC.bodyH + ENC.bushH;
  encoder.add(encBody, bushing, shaft);
  [encBody, shaftMesh].forEach(m => { m.castShadow = m.receiveShadow = true; });
  encoder.scale.setScalar(0.8);                               // the encoder is drawn 20% smaller (the knob isn't)
  scene.add(encoder);

  // USB-C port, centred on the back face (the case's outer wall is at z = -D/2): a stadium-shaped
  // pocket milled into the case with a silver USB-C receptacle at the bottom. There's no CSG here,
  // so the pocket is a stencil "window": a mask on the back face marks where the opening is visible,
  // and the pocket's inside is drawn only there, so it reads as a real cavity from any angle.
  {
    const PORT_Y = H * 0.5, POCKET = { w: 12.5, h: 7, depth: 2 };
    const backZ = -D / 2, floorZ = backZ + POCKET.depth;
    const flat = (w, h, r) => new T.ShapeGeometry(roundRect(new T.Shape(), 0, 0, w, h, r), 24);
    const facingOut = (mesh, z, order) => {          // a flat piece on the back, facing out of it
      mesh.rotation.y = Math.PI; mesh.position.set(0, PORT_Y, z); mesh.renderOrder = order; scene.add(mesh);
    };
    const inside = (opts) => Object.assign(new T.MeshStandardMaterial(opts), {
      depthTest: false, depthWrite: false,             // drawn through the case face, but only inside the mask
      stencilWrite: true, stencilRef: 1, stencilFunc: T.EqualStencilFunc,
    });
    // 1. mask: invisible, marks the opening wherever it's visible
    facingOut(new T.Mesh(flat(POCKET.w, POCKET.h, POCKET.h / 2 - 0.01), new T.MeshBasicMaterial({
      colorWrite: false, depthWrite: false,
      stencilWrite: true, stencilRef: 1, stencilFunc: T.AlwaysStencilFunc, stencilZPass: T.ReplaceStencilOp,
    })), backZ - 0.05, 10);
    // 2. the pocket: walls and floor, as one loft from the opening down to the floor
    const pocketGeo = stitch([
      ringPoints(POCKET.w / 2, POCKET.h / 2, POCKET.h / 2 - 0.01, 0, 0),
      ringPoints(POCKET.w / 2, POCKET.h / 2, POCKET.h / 2 - 0.01, 0, POCKET.depth),
    ], new T.Vector3(0, POCKET.depth, 0));
    pocketGeo.rotateX(Math.PI / 2);                    // depth runs into the case (+z)
    const pocket = new T.Mesh(pocketGeo, inside({ color: srgb(0x161618), roughness: 0.7, metalness: 0.25, side: T.DoubleSide }));
    pocket.position.set(0, PORT_Y, backZ); pocket.renderOrder = 11; scene.add(pocket);
    // 3. the receptacle on the floor: silver shell, dark opening, contact tongue
    facingOut(new T.Mesh(flat(8.94, 3.26, 1.6), inside({ color: srgb(0xc9cbd0), roughness: 0.3, metalness: 0.9 })), floorZ - 0.02, 12);
    facingOut(new T.Mesh(flat(8.3, 2.6, 1.28), inside({ color: 0x020203, roughness: 0.9 })), floorZ - 0.04, 13);
    facingOut(new T.Mesh(flat(6.6, 0.7, 0.3), inside({ color: srgb(0x2a2a2e), roughness: 0.6 })), floorZ - 0.06, 14);
  }

  // ---- pocket floor and switches (RGB off) ----
  const floorMat = new T.MeshStandardMaterial({ color: srgb(0x1b1b20), roughness: 0.75 }); // plate: dark, but catches the LED light
  const floor = new T.Mesh(new T.PlaneGeometry(WELL_W + 2, WELL_D + 2), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, FLOOR, WELL_Z);
  scene.add(floor);

  // MX-style upper casing (the lower casing sits below the plate, out of sight): a clear shell with
  // straight sides, a chamfer up to a flat top, and the rectangular opening the stem rides in.
  // Built as one continuous loft: down the outside, across the top, down into the stem opening.
  const CASING_H = 5, HOLE = { x: 3.6, z: 2.8, floor: 2.2 };
  function casingGeometry() {
    const rings = [
      ringPoints(7.8, 7.8, 0.8, 0, 0),
      ringPoints(7.8, 7.8, 0.8, 0, 3.0),
      ringPoints(7.4, 7.4, 0.8, 0, 3.6),
      ringPoints(5.9, 5.9, 0.6, 0, CASING_H),               // top edge
      ringPoints(HOLE.x, HOLE.z, 0.4, 0, CASING_H),         // rim of the stem opening
      ringPoints(HOLE.x, HOLE.z, 0.4, 0, HOLE.floor),
    ];
    return stitch(rings, new T.Vector3(0, HOLE.floor, 0));
  }
  const casingGeo = casingGeometry();
  const stemMat = new T.MeshStandardMaterial({ color: srgb(0xc4232c), roughness: 0.5 }); // Cherry MX Red
  const stemH = CAP_Y + 0.5 - (FLOOR + HOLE.floor);         // from the opening's floor up into the keycap
  const stemGeo = new T.BoxGeometry(HOLE.x * 2 - 1.2, stemH, HOLE.z * 2 - 1.2);
  const ledDotGeo = new T.SphereGeometry(0.9, 16, 8);

  // ---- keycaps: XDA profile ----
  // A loft of rounded rectangles from the 18.1 mm base up to a large, centred square top:
  // uniform height (no row sculpt or tilt), gently tapered walls, a rounded top edge and a
  // shallow spherical dish. The legend is a copy of the dished top surface, so it follows it.
  // Proportions from photos of the real caps: well-slanted walls rising from a crisp rounded-square
  // base to a smaller squircle top, a crisp top edge, and a subtle round dish.
  const CAP = {
    base: CAP_BASE / 2, baseExp: 10,                // base: superellipse exponent 10 ≈ square with tight corners
    topX: 6.4, topZ: 6.4, topExp: 4, topCz: 0,      // top: ≈12.8 mm squircle, centred
    height: 9.1, tilt: 0, dish: 0.7, fillet: 0.4,     // fillet: radius of the edge where the walls meet the top
  };
  // Superellipse ring |x/a|^e + |z/b|^e = 1 in the xz-plane, resampled to evenly spaced points
  // (same count and start point at every size, so rings stitch cleanly). e = 2 is an ellipse,
  // e ≈ 4 a squircle, large e a square with tight corners.
  function squircleRing(a, b, e, cz, y, N = 96) {
    const M = 1024, raw = [], len = [0];
    for (let i = 0; i <= M; i++) {
      const t = (i / M) * Math.PI * 2, c = Math.cos(t), s = Math.sin(t);
      raw.push([a * Math.sign(c) * Math.abs(c) ** (2 / e), b * Math.sign(s) * Math.abs(s) ** (2 / e)]);
      if (i) len.push(len[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]));
    }
    const pts = [];
    for (let k = 0, j = 0; k < N; k++) {
      const target = (k / N) * len[M];
      while (len[j + 1] < target) j++;
      const f = (target - len[j]) / (len[j + 1] - len[j] || 1);
      pts.push(new T.Vector3(raw[j][0] + (raw[j + 1][0] - raw[j][0]) * f, y, cz + raw[j][1] + (raw[j + 1][1] - raw[j][1]) * f));
    }
    return pts;
  }
  function ringPoints(hx, hz, r, cz, y, n = 7, m = 6) {
    // rounded rectangle in the xz-plane, same point count at every size so rings can be stitched:
    // n segments per corner arc, plus m points along each straight side so curved surfaces lofted
    // through these rings shade smoothly instead of showing long-triangle facets
    const pts = [];
    const corners = [[hx - r, hz - r, 0], [-(hx - r), hz - r, Math.PI / 2], [-(hx - r), -(hz - r), Math.PI], [hx - r, -(hz - r), Math.PI * 1.5]];
    const at = (c, a) => new T.Vector3(c[0] + r * Math.cos(a), y, cz + c[1] + r * Math.sin(a));
    corners.forEach((c, k) => {
      for (let i = 0; i <= n; i++) pts.push(at(c, c[2] + (i / n) * (Math.PI / 2)));
      const from = at(c, c[2] + Math.PI / 2), next = corners[(k + 1) % 4], to = at(next, next[2]);
      for (let j = 1; j <= m; j++) pts.push(from.clone().lerp(to, j / (m + 1)));
    });
    return pts;
  }
  // height offset of the top surface: a round dish, deepest in the middle and easing out toward
  // the edges and corners with no crease, plus any tilt (none for these caps)
  const topOffset = (x, z) => {
    const r2 = ((x / CAP.topX) ** 2 + ((z - CAP.topCz) / CAP.topZ) ** 2) / 2;  // 0 at the centre, 1 at the corners
    return -CAP.tilt * (z - CAP.topCz) - CAP.dish * Math.max(0, 1 - r2) ** 2;
  };
  function stitch(rings, center, uvFor) {
    const M = rings[0].length, pos = [], uv = [], idx = [];
    rings.forEach(r => r.forEach(p => { pos.push(p.x, p.y, p.z); if (uvFor) uv.push(...uvFor(p)); }));
    for (let i = 0; i < rings.length - 1; i++) {
      for (let j = 0; j < M; j++) {
        const a = i * M + j, b = i * M + (j + 1) % M, c = (i + 1) * M + j, d = (i + 1) * M + (j + 1) % M;
        idx.push(a, c, b, b, c, d);
      }
    }
    const ci = rings.length * M;
    pos.push(center.x, center.y, center.z); if (uvFor) uv.push(...uvFor(center));
    for (let j = 0; j < M; j++) idx.push((rings.length - 1) * M + j, ci, (rings.length - 1) * M + (j + 1) % M);
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    if (uvFor) g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }
  function capGeometry() {
    const { base, baseExp, topX, topZ, topExp, topCz, height, fillet } = CAP;
    const sx = topX + fillet * 0.8, sz = topZ + fillet * 0.8, sy = height - fillet;
    const rings = [];
    // slanted walls from the base to the shoulder, morphing from rounded square to squircle
    for (let i = 0; i <= 8; i++) {
      const u = i / 8;
      rings.push(squircleRing(base + (sx - base) * u, base + (sz - base) * u, baseExp + (topExp - baseExp) * u, topCz * u, sy * u));
    }
    // crisp rounded edge from the shoulder onto the top
    for (let i = 1; i <= 5; i++) {
      const a = (i / 5) * Math.PI / 2;
      rings.push(squircleRing(topX + (sx - topX) * Math.cos(a), topZ + (sz - topZ) * Math.cos(a), topExp, topCz, sy + fillet * Math.sin(a)));
    }
    // blend the tilt and dish in toward the top
    rings.forEach(r => r.forEach(p => { const w = Math.min(1, p.y / height) ** 4; p.y += w * topOffset(p.x, p.z); }));
    // the dished top, as rings shrinking to the centre
    const edge = rings[rings.length - 1];
    const topRings = [edge];
    [0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1].forEach(sc => topRings.push(edge.map(p => { // fine steps keep the dish smooth
      const x = p.x * sc, z = topCz + (p.z - topCz) * sc;
      return new T.Vector3(x, height + topOffset(x, z), z);
    })));
    const center = new T.Vector3(0, height + topOffset(0, topCz), topCz);
    const body = stitch(rings.concat(topRings.slice(1)), center);
    const top = (size) => stitch(topRings.map(r => r.map(p => p.clone().setY(p.y + 0.03))), center.clone().setY(center.y + 0.03),
      p => [0.5 + p.x / size, 0.5 - (p.z - topCz) / size]);
    return { body, top };
  }
  const cap = capGeometry();
  const legendGeo = cap.top(8); // the legend artwork spans 8 mm of the top

  function legendTexture(icon) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const tex = new T.CanvasTexture(c);
    tex.encoding = T.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const svg = icons[icon].replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" ').replace(/currentColor/g, '#ffffff');
    const img = new Image();
    img.onload = () => { ctx.clearRect(0, 0, 256, 256); ctx.drawImage(img, 0, 0, 256, 256); tex.needsUpdate = true; };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return tex;
  }

  const pickables = [];
  const keys = {};

  // Hover outlines a control's full silhouette; selection tints it blue.
  // The outline is a stencil outline: each control marks the pixels where it is visible with its own
  // stencil value, and a copy of it grown 0.3 mm along its normals is drawn in blue only where that
  // value isn't present. Depth testing stays on, so whatever is physically in front of the control
  // (a neighbouring key, the case, the knob) hides the outline exactly as it hides the control.
  // Values 11-17 keep clear of the USB pocket's stencil window, which uses 1.
  const HILITE = 0x6f8cff, OUTLINE_W = 0.3;
  const CAP_COLOR = srgb(0x0e1019), CAP_SELECTED = srgb(0x3a4f9c); // keycap plastic, and as tinted when selected
  const markStencil = (material, ref) => Object.assign(material, {
    stencilWrite: true, stencilRef: ref, stencilFunc: T.AlwaysStencilFunc, stencilZPass: T.ReplaceStencilOp,
  });
  const outlineMaterial = ref => new T.MeshBasicMaterial({
    color: HILITE, transparent: true, opacity: 0, depthWrite: false, toneMapped: false,
    stencilWrite: true, stencilRef: ref, stencilFunc: T.NotEqualStencilFunc,   // only outside the control itself
  });
  function inflate(geometry, w) {                              // grow a surface along its vertex normals
    const g = geometry.clone(), p = g.attributes.position, n = g.attributes.normal;

    const t = clock.getElapsedTime(), dt = Math.min(0.1, t - lastT);
    lastT = t;
    runDemo(t);
    // demo backlight: fade in while idle (after a beat), fade out once someone takes over
    const glowTarget = turntable.on && !reduceMotion && t > 0.8 ? 1 : 0;
    idleGlow += (glowTarget - idleGlow) * Math.min(1, dt * (glowTarget ? 1.2 : 3));
    // turntable: about one turn every 80 s, with eased start and stop
    turntable.speed += ((turntable.on && !turntable.held ? 0.08 : 0) - turntable.speed) * Math.min(1, dt * 1.2);
    if (Math.abs(turntable.speed) > 1e-4) {
      view.yaw += turntable.speed * dt;
      if (turntable.on && !turntable.held) {
        // follow the orbit's height and distance; eased, so resuming from another view glides into it
        const k = Math.min(1, dt * 1.5);
        view.pitch += (orbitPitch(view.yaw) - view.pitch) * k;
        view.zoom += (orbitZoom(view.yaw) - view.zoom) * k;
      }
      placeCamera();
    }
    if (turntable.goHome) {
      // quick ease (settles in about a third of a second)
      const { yaw, pitch, zoom = 1 } = turntable.target, k = Math.min(1, dt * 9);
      view.yaw += (yaw - view.yaw) * k;
      view.pitch += (pitch - view.pitch) * k;
      view.zoom += (zoom - view.zoom) * k;
      if (Math.abs(yaw - view.yaw) < 1e-3 && Math.abs(pitch - view.pitch) < 1e-3 && Math.abs(zoom - view.zoom) < 1e-3) {
        view.yaw = yaw; view.pitch = pitch; view.zoom = zoom; turntable.goHome = false;
      }
      placeCamera();
    }
    while (presses.length && t - presses[0].t > 1.5) presses.shift();
    if (!viewLocked) par.to = 0;
    if (Math.abs(par.to - par.yaw) > 1e-5) { par.yaw += (par.to - par.yaw) * Math.min(1, dt * 3); placeCamera(); }
    // explode / reassemble, eased (~0.5 s), alongside the camera's turn to iso
    if (explodeT !== explodeTo) {
      explodeT += (explodeTo - explodeT) * Math.min(1, dt * 7);
      if (Math.abs(explodeTo - explodeT) < 1e-3) explodeT = explodeTo;
      // shadows fade out as the parts float (they'd land far from them as dark blobs on the case) and
      // fade back in as they settle, so nothing pops
      const sf = (1 - explodeT) ** 2;
      sun.intensity = SUN * sf; sunFlat.intensity = SUN * (1 - sf);
      ground.material.opacity = GROUND_SHADOW * sf;
      placeCamera();
    }
    // selection: shift the material itself toward blue so lighting and shading still read, plus a
    // whisper of glow; hover: a fine, slightly translucent ring
    const SEL_GLOW = 0.07, OUTLINE = 0.9;
    const ease = Math.min(1, dt * 10);
    Object.entries(keys).forEach(([id, k]) => {
      k.t += ((k.down ? 1 : 0) - k.t) * 0.45;
      // hover (both modes, from the model or the Controls list) outlines; selection fills
      const hoverTo = (!drag && hover.id === id) || hover.panel === id ? 1 : 0;
      k.hoverT = (k.hoverT || 0) + (hoverTo - (k.hoverT || 0)) * ease;
      k.selT = (k.selT || 0) + ((id === target ? 1 : 0) - (k.selT || 0)) * ease;
      k.group.position.y = CAP_Y - TRAVEL * k.t + explodeT * (EXPLODE.lift[id] || 0);
      k.stem.position.y = CAP_Y + 0.5 - stemH / 2 - TRAVEL * k.t;
      k.outlineMat.opacity = OUTLINE * k.hoverT;
      k.mat.color.copy(CAP_COLOR).lerp(CAP_SELECTED, k.selT);
      k.mat.emissiveIntensity = SEL_GLOW * k.selT;
      k.heat = Math.max(0, k.heat - 0.004);
      const [r, g, b] = ledColor(k, t);
      const lit = Math.max(r, g, b);
      k.ledLin.setRGB(r, g, b).convertSRGBToLinear();
      k.ledDotMat.color.copy(k.ledLin).multiplyScalar(4);
      k.housingMat.emissive.copy(k.ledLin).multiplyScalar(1.1);
      k.housingMat.opacity = 0.28 + 0.35 * lit;                 // lit plastic reads as more solid
      k.ledLight.color.setRGB(r, g, b);
      k.ledLight.intensity = 8 * lit;
    });
    knobShown += (knobAngle - knobShown) * Math.min(1, dt * 22);   // catches up within ~0.1 s, even on fast spins
    spinner.rotation.y = -knobShown;
    shaft.rotation.y = -knobShown;
    knobT += ((knobDown ? 1 : 0) - knobT) * 0.45;
    const knobHoverTo = (!drag && hover.id === 'press') || ['cw', 'ccw', 'press'].includes(hover.panel) ? 1 : 0;
    knobHoverT += (knobHoverTo - knobHoverT) * ease;
    knob.position.y = H - KNOB_SINK - 1.2 * knobT + explodeT * EXPLODE.knob;
    shaft.position.y = ENC.bodyH + ENC.bushH - 1.2 * knobT;      // the encoder's push switch
    knobSelT += ((['cw', 'ccw', 'press'].includes(target) ? 1 : 0) - knobSelT) * ease;
    knobOutlineMat.opacity = OUTLINE * knobHoverT;
    knobSide.color.copy(KNOB_SIDE_COLOR).lerp(KNOB_SELECTED, knobSelT);
    knobTop.color.copy(KNOB_TOP_COLOR).lerp(KNOB_SELECTED, knobSelT);
    knobSide.emissiveIntensity = knobTop.emissiveIntensity = SEL_GLOW * knobSelT;
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    press(id, down) {
      if (id === 'press') { knobDown = down; return; }
      const k = keys[id];
      if (!k) return;
      if (down && !k.down) {
        const t = clock.getElapsedTime();
        k.pressedAt = t; k.heat = Math.min(1.2, k.heat + 0.25);
        presses.push({ t, x: k.led[0], y: k.led[1] });
      }
      k.down = down;
    },
    setLighting(state) { lighting = state; },
    turn(dir) { knobAngle += dir * (Math.PI / 10); },
    reset() { knobAngle = 0; },
    setTarget(id) { target = id; },
    setHover(id) { hover.panel = id; },          // highlight a control from outside (the Controls list)
    // where each control sits on screen (px within the canvas), for the config-mode flags, plus the
    // device's on-screen bounds; anchors are the keycap tops and the knob's top edge facing the viewer
    anchors() {
      const w = canvas.clientWidth, h = canvas.clientHeight, v = new T.Vector3();
      const toScreen = (p, cam = camera) => { p.project(cam); return { x: (p.x + 1) / 2 * w, y: (1 - p.y) / 2 * h }; };
      const out = {};
      // Each control's outer silhouette corners, halfway up its side: the leftmost and rightmost points
      // on screen. Flags are placed level with these at rest (so they stay still while a key is
      // pressed) and pointers run straight across to the live corner.
      const sil = (obj, pts, dy, cam) => {
        const sp = pts.map(([x, y, z]) => toScreen(obj.localToWorld(v.set(x, y + dy, z)), cam));
        const l = sp.reduce((m, p) => p.x < m.x ? p : m), r = sp.reduce((m, p) => p.x > m.x ? p : m);
        return { l: { ...l }, r: { ...r } };
      };
      // keycap corners at mid-height (the walls slant, so the half-width there is between base and top)
      const mid = CAP.height / 2, hwm = (CAP.base + CAP.topX + CAP.fillet * 0.8) / 2 * 0.92;
      const capCorners = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([sx, sz]) => [sx * hwm, mid, sz * hwm]);
      Object.entries(keys).forEach(([id, k]) => {
        const rest = sil(k.group, capCorners, TRAVEL * k.t, baseCam), live = sil(k.group, capCorners, 0, camera);
        out[id] = { rest, live };
      });
      // The knob is round, so its outline edge is found exactly rather than from sample points (which
      // made the flag hop between neighbours as the view moved): for each camera, the edge points sit
      // at ±radius along the horizontal direction square to the line of sight to the knob's axis.
      const knobEdge = (cam, dy) => {
        const c = knob.localToWorld(new T.Vector3(0, KNOB_H / 2 + dy, 0));
        const side = new T.Vector3(cam.position.z - c.z, 0, c.x - cam.position.x).normalize().multiplyScalar(KNOB_R);
        const a = toScreen(c.clone().add(side), cam), b = toScreen(c.clone().sub(side), cam);
        return a.x < b.x ? { l: a, r: b } : { l: b, r: a };
      };
      out.knob = { rest: knobEdge(baseCam, 1.2 * knobT), live: knobEdge(camera, 0) };
      out.exploded = explodeT;
      const pts = [];
      for (const x of [-W / 2, W / 2]) for (const z of [-D / 2, D / 2]) for (const y of [0, H + KNOB_H]) pts.push(toScreen(v.set(x, y, z), baseCam));
      out.box = { l: Math.min(...pts.map(p => p.x)), r: Math.max(...pts.map(p => p.x)), t: Math.min(...pts.map(p => p.y)), b: Math.max(...pts.map(p => p.y)) };
      out.settled = !turntable.goHome;
      return out;
    },
    // 'interaction': stop the preview and ease to the iso working view.
    // 'preview': orbit (gliding in from the current view), demo taps and demo backlight.
    setMode(mode) {
      viewLocked = mode === 'interaction';
      explodeTo = mode === 'interaction' && !reduceMotion ? 1 : 0;
      if (reduceMotion) { explodeT = mode === 'interaction' ? 1 : 0; explodeTo = explodeT; }
      if (mode === 'interaction') { snapToIso(); return; }
      if (reduceMotion || turntable.on) return;
      turntable.goHome = false;
      turntable.on = true;
      demo.next = clock.getElapsedTime() + 1.5;
    },
    setTested(set) { tested.clear(); set.forEach(id => tested.add(id)); },
    release() { Object.values(keys).forEach(k => { k.down = false; }); knobDown = false; },
  };
};

  function pretty(sig) {
    if (!sig) return '';
    if (sig.startsWith('wheel:')) return sig === 'wheel:up' ? 'Scroll up' : 'Scroll down';
    const sym = isMac ? { Ctrl: '⌃', Alt: '⌥', Shift: '⇧', Meta: '⌘' } : { Ctrl: 'Ctrl+', Alt: 'Alt+', Shift: 'Shift+', Meta: 'Win+' };

  const edit = {

    original: null, undo: [], layer: 0, ctrl: null, more: false, mods: 0, cat: 'Media', query: '',

  // ---- reading everything off the npad on connect ----
  async function loadDeviceState() {
    edit.ready = false;
    const layers = (await hidQuery(0x11))[1];
    edit.keymap = []; edit.enc = [];
    for (let l = 0; l < layers; l++) {
      const row = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const d = await hidQuery(0x04, l, r, c); row.push((d[4] << 8) | d[5]); }

    edit.macroCount = (await hidQuery(0x0c))[1];

    edit.undo = []; edit.layer = Math.min(edit.layer, layers - 1);

  // the tester's key-event bindings follow the npad's base layer
  function relearnMap() {
    if (!edit.ready) return;

    save();
  }

  // ---- writing: each change is an op that can be undone ----
  async function writeOp(op, value) {
    if (op.kind === 'mx') {
      await hidQuery(0x05, op.layer, Math.floor(op.idx / 3), op.idx % 3, value >> 8, value & 0xff);
      edit.keymap[op.layer][op.idx] = value;
    } else if (op.kind === 'enc') {
      await hidQuery(0x15, op.layer, 0, op.cw, value >> 8, value & 0xff);
      edit.enc[op.layer][op.cw] = value;
    } else if (op.kind === 'macros') {
      await writeMacros(value);
    }
  }
  let editQueue = Promise.resolve();
  function runEdit(fn) {                                        // one change at a time; failures become a toast
    editQueue = editQueue.then(fn).catch(err => toast(`Couldn't write to the npad: ${err?.message || err}`, 'warn', 7000));
    return editQueue;
  }
  function opFor(layer, id, to) {
    const i = byId[id], from = getCode(layer, id);

  }

  function setCode(layer, id, code) {

  // ---- macros: QMK dynamic macro buffer (VIA protocol 11+) ----
  // In the buffer, macros are NUL-terminated; plain bytes are typed as text, and 0x01 starts an action:
  // 01 01 kc = tap, 01 02 kc = press, 01 03 kc = release, 01 04 <digits> '|' = wait in ms.
  // In the editor a macro is a list of steps: text, key (a tap, with optional modifiers held), hold,
  // release, wait.
  function parseMacroBytes(bytes, count) {
    const out = []; let cur = [], i = 0;
    while (i < bytes.length && out.length < count) {
      const b = bytes[i];
      if (b === 0) { out.push(foldChords(cur)); cur = []; }
      else if (b === 1) {
        const a = bytes[++i];

      } else {

  function foldChords(seq) {                                    // press mods, tap a key, release mods -> one key step

      if (s.t === 'down' && MOD_KEYS.includes(s.key)) {

  // ---- VIA layout files ----
  const vendorProductId = () => hidDev.vendorId * 65536 + hidDev.productId;
  function saveLayoutFile() {
    if (!edit.ready) return;
    const file = {
      name: hidDev.productName || 'npad',
      vendorProductId: vendorProductId(),
      macros: edit.macros.map(macroToExpression),
      layers: edit.keymap.map(l => l.map(codeToVia)),

    return runEdit(async () => {

      if (!data || !Array.isArray(data.layers) || !data.vendorProductId) { toast("That file isn't a VIA layout.", 'warn'); return; }
      if (data.vendorProductId !== vendorProductId()) { toast(`That layout is for a different keyboard${data.name ? ` (${data.name})` : ''}.`, 'warn'); return; }

      }));

  // ---- editor UI ----

  function renderKeymap() {
    if (!edit.ready) return;

    const cur = edit.ctrl ? getCode(edit.layer, edit.ctrl) : null;
    $('#pick-title').textContent = edit.ctrl ? byId[edit.ctrl].name : 'Keys';
    $('#pick-current').textContent = !edit.ctrl ? '' : edit.layer ? `Layer ${edit.layer}: ${labelFor(cur)}` : labelFor(cur);
    $('#pick-cats').innerHTML = PICKER.filter(([, codes]) => codes.length).map(([name]) =>
      `<button type="button" data-cat="${name}" aria-pressed="${!edit.query && name === edit.cat}">${name}</button>`).join('');
    $('#pick-mods').querySelectorAll('[data-mod]').forEach(b => b.setAttribute('aria-pressed', String(!!(edit.mods & +b.dataset.mod))));

  // ---- record mode: the selected control takes the next key or shortcut pressed ----
  const CODE_TO_KC = (() => {
    const m = {};

    for (let i = 1; i <= 9; i++) m['Digit' + i] = 0x1d + i;

    Object.assign(m, { Enter: 0x28, Escape: 0x29, Backspace: 0x2a, Tab: 0x2b, Space: 0x2c, Minus: 0x2d, Equal: 0x2e,
      BracketLeft: 0x2f, BracketRight: 0x30, Backslash: 0x31, Semicolon: 0x33, Quote: 0x34, Backquote: 0x35, Comma: 0x36,
      Period: 0x37, Slash: 0x38, CapsLock: 0x39, PrintScreen: 0x46, ScrollLock: 0x47, Pause: 0x48, Insert: 0x49, Home: 0x4a,
      PageUp: 0x4b, Delete: 0x4c, End: 0x4d, PageDown: 0x4e, ArrowRight: 0x4f, ArrowLeft: 0x50, ArrowDown: 0x51, ArrowUp: 0x52,
      NumLock: 0x53, NumpadDivide: 0x54, NumpadMultiply: 0x55, NumpadSubtract: 0x56, NumpadAdd: 0x57, NumpadEnter: 0x58,
      Numpad1: 0x59, Numpad2: 0x5a, Numpad3: 0x5b, Numpad4: 0x5c, Numpad5: 0x5d, Numpad6: 0x5e, Numpad7: 0x5f, Numpad8: 0x60,
      Numpad9: 0x61, Numpad0: 0x62, NumpadDecimal: 0x63, IntlBackslash: 0x64, ContextMenu: 0x65, NumpadEqual: 0x67,
      AudioVolumeMute: 0xa8, AudioVolumeUp: 0xa9, AudioVolumeDown: 0xaa, MediaTrackNext: 0xab, MediaTrackPrevious: 0xac,
      MediaStop: 0xad, MediaPlayPause: 0xae,
      ControlLeft: 0xe0, ShiftLeft: 0xe1, AltLeft: 0xe2, MetaLeft: 0xe3, ControlRight: 0xe4, ShiftRight: 0xe5, AltRight: 0xe6, MetaRight: 0xe7 });
    return m;
  })();
  const recording = () => !!(edit.ctrl && flagsOn());
  let lonelyMod = null;                             // a modifier pressed on its own: recorded when it's released alone
  function recordCode(code) {
    const id = edit.ctrl;
    pick(null);
    setCode(edit.layer, id, code).then(() => flashFlag(id));
  }
  window.addEventListener('keydown', e => {
    if (!recording() || inField(e)) return;
    e.preventDefault(); e.stopImmediatePropagation();  // the page's tester doesn't see keys while recording
    if (e.repeat) return;
    if (e.key === 'Escape' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) { pick(null); return; }
    const kc = CODE_TO_KC[e.code];
    if (kc == null) { toast(`That key can't be recorded here. Use More to pick it.`); return; }
    if (kc >= 0xe0) { lonelyMod = e.code; return; }
    lonelyMod = null;
    const mods = (e.ctrlKey ? 1 : 0) | (e.shiftKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0);
    recordCode(mods && kc <= 0xa4 ? (mods << 8) | kc : kc);
  }, true);
  window.addEventListener('keyup', e => {
    if (!recording() || inField(e)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (lonelyMod && e.code === lonelyMod) { lonelyMod = null; recordCode(CODE_TO_KC[e.code]); }
  }, true);

  // ---- flags: what each control sends, called out around the model in config mode ----
  const FLAGS = [['k1'], ['k2'], ['k3'], ['k4'], ['k5'], ['k6'], ['knob', ['ccw', 'press', 'cw']]];
  // Little line drawings for the flags: a keycap with its legend, or the knob with what it's doing.
  const ICON_STROKE = 'fill="none" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"';
  function flagIcon(id) {
    const icon = INPUTS.find(i => i.id === id)?.icon;
    if (icon) {
      // the keycap's top as a flat outline (a rounded squircle), with its legend inside; the outline
      // matches the legends' Phosphor-light stroke (12/256 of an 11-unit icon ≈ 0.5)
      const legend = ICONS[icon].replace('<svg ', '<svg x="6.5" y="6.5" width="11" height="11" ');
      return `<svg viewBox="0 0 24 24" width="24" height="24"><g ${ICON_STROKE}><rect x="2.5" y="2.5" width="19" height="19" rx="6"/></g><g fill="currentColor">${legend}</g></svg>`;
    }
    const knob = '<circle cx="12" cy="14" r="6.5"/><circle cx="10" cy="12" r="1.4"/>';
    const marks = {
      ccw: '<path d="M18.5 7.5A9.5 9.5 0 0 0 4 9.5"/><path d="M3.6 6.2 4 9.5 7.2 8.8"/>',
      cw: '<path d="M5.5 7.5A9.5 9.5 0 0 1 20 9.5"/><path d="M20.4 6.2 20 9.5 16.8 8.8"/>',
      press: '<path d="M12 1.5v4"/><path d="M9.8 3.6 12 5.8 14.2 3.6"/>',
    };
    return `<svg viewBox="0 0 24 24" width="24" height="24"><g ${ICON_STROKE}>${knob}${marks[id] || ''}</g></svg>`;
  }
  // which side of its control each flag sits on, at the iso view: keys sharing a step of the explode
  // split left/right (shrimp | globe, sailboat | arrow), the rest alternate down the staircase
  const FLAG_SIDE = { knob: 'right', k1: 'left', k4: 'left', k2: 'right', k5: 'left', k3: 'right', k6: 'right' };
  const flagsOn = () => !!(dev3d && hidDev && edit.ready && panelsOpen());
  function renderFlags() {
    const on = flagsOn();
    $('#flags').classList.toggle('on', on); $('#flag-lines').classList.toggle('on', on);
    $('#popover').hidden = !(on && edit.ctrl && edit.more);
    if (!on) return;
    $('#flags').innerHTML = FLAGS.map(([fid, rows = [fid]]) => `<div class="flag" data-flag="${fid}">${rows.map(id => {
      // the icon is the test light: it flashes blue when the control fires, then stays light blue
      const rec = id === edit.ctrl, dot = '';
      const icon = `<span class="flag-icon${tested.has(id) ? ' ok' : ''}" aria-hidden="true" title="${tested.has(id) ? 'Works' : 'Not pressed yet'}">${flagIcon(id)}</span>`;
      if (rec) return `<div class="flag-row recording" data-input="${id}" aria-pressed="true" role="group" aria-label="${esc(byId[id].name)}: press a key">
        ${dot}${icon}<span class="flag-code" aria-live="polite">${edit.more ? 'Choose a key…' : 'Press a key…'}</span>
        <button type="button" class="flag-more" data-more aria-expanded="${edit.more}">More</button></div>`;
      return `<button type="button" class="flag-row" data-input="${id}" aria-pressed="false" aria-label="${esc(byId[id].name)}" title="${esc(byId[id].name)}">
        ${dot}${icon}<span class="flag-code">${esc(labelFor(getCode(edit.layer, id)))}</span></button>`;
    }).join('')}</div>`).join('');
    layoutFlags();
  }
  function flashFlag(id) {
    const row = document.querySelector(`#flags [data-input="${id}"]`);
    if (!row) return;
    row.classList.add('hit'); clearTimeout(row._t); row._t = setTimeout(() => row.classList.remove('hit'), 260);
  }
  // Flags sit right beside their control: with the model exploded, each keycap is in its own band on
  // screen, so a flag goes level with it, on the outer side. Anything that would still overlap is
  // pushed apart, and everything is kept inside the stage.
  function layoutFlags() {
    if (!flagsOn()) return;
    const a = dev3d.anchors(), stage = $('#npad3d'), W = stage.clientWidth, Hh = stage.clientHeight;
    const PAD = 6, GAP = 32, bottomLimit = Hh - 12;
    const c = { x: (a.box.l + a.box.r) / 2, y: (a.box.t + a.box.b) / 2 }, hw = (a.box.r - a.box.l) / 2, hh = (a.box.b - a.box.t) / 2;
    const items = FLAGS.map(([fid]) => {
      const el = document.querySelector(`#flags [data-flag="${fid}"]`), at = a[fid];
      const w = el.offsetWidth, h = el.offsetHeight, left = FLAG_SIDE[fid] === 'left';
      const p = left ? at.rest.l : at.rest.r;                    // the corner the pointer meets, at rest
      return { fid, el, at, w, h, left, x: left ? p.x - GAP - w : p.x + GAP, y: p.y - h / 2 };
    });
    // align each side into a column: left flags share a right edge, right flags a left edge, set by
    // whichever control on that side reaches furthest out; pointers just run as far as they need to
    const leftEdge = Math.min(...items.filter(it => it.left).map(it => it.x + it.w));
    const rightEdge = Math.max(...items.filter(it => !it.left).map(it => it.x));
    items.forEach(it => { it.x = it.left ? leftEdge - it.w : rightEdge; });
    const clamp = r => { r.x = Math.max(12, Math.min(W - 12 - r.w, r.x)); r.y = Math.max(12, Math.min(bottomLimit - r.h, r.y)); };
    items.forEach(clamp);
    for (let iter = 0; iter < 60; iter++) {                    // separate overlapping flags
      let moved = false;
      for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
        const p = items[i], q = items[j];
        const ox = Math.min(p.x + p.w, q.x + q.w) - Math.max(p.x, q.x) + PAD;
        const oy = Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y) + PAD;
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        if (oy < ox) { const s = (p.y + p.h / 2 < q.y + q.h / 2 ? -1 : 1) * oy / 2; p.y += s; q.y -= s; }
        else { const s = (p.x + p.w / 2 < q.x + q.w / 2 ? -1 : 1) * ox / 2; p.x += s; q.x -= s; }
        clamp(p); clamp(q);
      }
      if (!moved) break;
    }
    let lines = '';
    items.forEach(it => {
      it.el.style.transform = `translate(${Math.round(it.x)}px, ${Math.round(it.y)}px)`;
      // the pointer runs straight across, at 90° to the flag's edge, to the control's outer corner
      // (its live position, so it stays attached when a key goes down or the model drifts with the mouse)
      const end = it.left ? it.at.live.l : it.at.live.r;
      const ex = it.left ? it.x + it.w : it.x, ey = Math.max(it.y + 6, Math.min(it.y + it.h - 6, end.y));
      const sel = it.fid === edit.ctrl || (it.fid === 'knob' && ['ccw', 'press', 'cw'].includes(edit.ctrl));
      lines += `<g class="${sel ? 'sel' : ''}"><path d="M${end.x},${end.y} L${ex},${ey}"/><circle cx="${end.x}" cy="${end.y}" r="2.5"/></g>`;
    });
    const cx = c.x;
    $('#flag-lines').innerHTML = lines;
    // the picker opens beside the selected flag, on the same side, clamped inside the stage
    const selFlag = items.find(it => it.fid === edit.ctrl || (it.fid === 'knob' && ['ccw', 'press', 'cw'].includes(edit.ctrl)));
    const pop = $('#popover');
    if (selFlag && !pop.hidden) {
      // beside the flag, toward the model, so the flag stays visible next to its picker
      const pw = pop.offsetWidth, ph = pop.offsetHeight, left = selFlag.x + selFlag.w / 2 < cx;
      let px = left ? selFlag.x + selFlag.w + 10 : selFlag.x - pw - 10;
      let py = selFlag.y + selFlag.h / 2 - ph / 2;
      py = Math.max(12, Math.min(Hh - 12 - ph, py));
      px = Math.max(12, Math.min(W - 12 - pw, px));
      pop.style.transform = `translate(${Math.round(px)}px, ${Math.round(py)}px)`;
    }
  }
  (function followModel() { layoutFlags(); requestAnimationFrame(followModel); })();  // keeps up with the snap and resizes
  $('#flags').addEventListener('mouseover', e => { const r = e.target.closest('[data-input]'); dev3d?.setHover(r ? r.dataset.input : null); });
  $('#flags').addEventListener('mouseleave', () => dev3d?.setHover(null));
  function macroPreview(n) {
    const steps = edit.macros[n] || [];
    if (!steps.length) return 'empty';
    return macroToExpression(steps).replace(/\{KC_/g, '{').slice(0, 18);
  }

  // macro editor
  const STEP_TYPES = [['text', 'Type text'], ['key', 'Press a key'], ['down', 'Hold'], ['up', 'Release'], ['wait', 'Wait']];
  const keyOptions = selected => PICKER.filter(([n]) => !['Layers', 'Macros', 'Lighting', 'Special'].includes(n)).map(([n, cs]) =>
    `<optgroup label="${n}">${cs.filter(c => c <= 0xff).map(c => `<option value="${KC_NAME[c]}"${KC_NAME[c] === selected ? ' selected' : ''}>${esc(labelFor(c))}</option>`).join('')}</optgroup>`).join('');
  function renderMacros() {
    if (!edit.ready) return;
    if (!edit.macroCount) { $('#macro-list').innerHTML = '<p class="muted">This firmware has macros turned off.</p>'; return; }
    $('#macro-list').innerHTML = range(0, edit.macroCount - 1).map(n =>
      `<button type="button" data-macro="${n}" aria-pressed="${n === edit.macroSel}" class="${edit.draft[n]?.length ? 'used' : ''}">M${n}</button>`).join('');
    $('#macro-title').textContent = `Macro ${edit.macroSel}`;
    const steps = edit.draft[edit.macroSel] || [];
    $('#macro-steps').innerHTML = steps.length ? steps.map((s, i) => {
      let body = '';
      if (s.t === 'text') body = `<input type="text" data-field="v" value="${esc(s.v)}" placeholder="Text to type" aria-label="Text to type">`;
      else if (s.t === 'wait') body = `<input type="number" min="0" max="9999" step="10" data-field="ms" value="${s.ms}" aria-label="Milliseconds"><span class="unit">ms</span>`;
      else body = (s.t === 'key' ? `<span class="mods">${[['KC_LCTL', '⌃'], ['KC_LALT', '⌥'], ['KC_LSFT', '⇧'], ['KC_LGUI', '⌘']].map(([m, sym]) =>
          `<button type="button" data-step-mod="${m}" aria-pressed="${s.mods.includes(m)}" title="${KEY_LABELS[m]}">${sym}</button>`).join('')}</span>` : '')
        + `<select data-field="key" aria-label="Key">${keyOptions(s.key)}</select>`;
      return `<div class="step" data-step="${i}"><span class="step-type">${STEP_TYPES.find(t => t[0] === s.t)[1]}</span>
        <div class="step-body">${body}</div><button type="button" class="step-del" data-del="${i}" aria-label="Remove step">×</button></div>`;
    }).join('') : '<p class="muted">This macro is empty. Add a step below, then click a key’s flag and pick it from the Macros group.</p>';
    renderMacroMeta();
  }
  function renderMacroMeta() {
    const used = macroBytesUsed(edit.draft);
    $('#macro-meter').textContent = `${used} / ${edit.macroSize} bytes`;
    $('#macro-meter').classList.toggle('over', used > edit.macroSize);
    $('#macro-state').textContent = edit.macroState;
  }

  // events
  $('#layer-seg').addEventListener('click', e => { const b = e.target.closest('[data-layer]'); if (b) { edit.layer = +b.dataset.layer; renderKeymap(); } });
  $('#pick-cats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (b) { edit.cat = b.dataset.cat; edit.query = ''; $('#pick-search').value = ''; renderKeymap(); } });
  $('#pick-search').addEventListener('input', e => { edit.query = e.target.value; renderKeymap(); });
  $('#pick-mods').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (b) { edit.mods ^= +b.dataset.mod; renderKeymap(); } });
  $('#pick-keys').addEventListener('click', e => {
    const b = e.target.closest('[data-code]'); if (!b) return;
    const id = edit.ctrl;
    edit.mods = 0; pick(null);
    setCode(edit.layer, id, +b.dataset.code).then(() => flashFlag(id));
  });
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-restore').addEventListener('click', restoreOriginal);
  $('#btn-save-layout').addEventListener('click', saveLayoutFile);
  $('#btn-load-layout').addEventListener('click', () => $('#layout-file').click());
  $('#layout-file').addEventListener('change', e => { const f = e.target.files?.[0]; if (f) loadLayoutFile(f); e.target.value = ''; });
  $('#macro-list').addEventListener('click', e => { const b = e.target.closest('[data-macro]'); if (b) { edit.macroSel = +b.dataset.macro; renderMacros(); } });
  $('#macro-add').addEventListener('click', e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    const t = b.dataset.add, step = t === 'text' ? { t, v: '' } : t === 'wait' ? { t, ms: 100 } : t === 'key' ? { t, key: 'KC_A', mods: [] } : { t, key: 'KC_LSFT' };
    edit.draft[edit.macroSel].push(step); renderMacros(); macroChanged();
    if (t === 'text') $(`#macro-steps [data-step="${edit.draft[edit.macroSel].length - 1}"] input`)?.focus();
  });
  const stepAt = el => edit.draft[edit.macroSel][+el.closest('[data-step]').dataset.step];
  $('#macro-steps').addEventListener('input', e => {
    const f = e.target.dataset.field; if (!f) return;
    const s = stepAt(e.target); s[f] = f === 'ms' ? Math.max(0, Math.min(9999, parseInt(e.target.value, 10) || 0)) : e.target.value;
    renderMacroMeta(); macroChanged();
  });
  $('#macro-steps').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) { edit.draft[edit.macroSel].splice(+del.dataset.del, 1); renderMacros(); macroChanged(); return; }
    const mod = e.target.closest('[data-step-mod]');
    if (mod) { const s = stepAt(mod), m = mod.dataset.stepMod; s.mods = s.mods.includes(m) ? s.mods.filter(x => x !== m) : [...s.mods, m]; renderMacros(); macroChanged(); }
  });
  $('#macro-clear').addEventListener('click', () => { edit.draft[edit.macroSel] = []; renderMacros(); macroChanged(); });

  render();
  autoConnect();                                  // an npad connected on an earlier visit reconnects by itself
})();
</script>
</body>
</html>
