<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Test every key and the knob on your npad macropad.">
<title>npad configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: device-first and centered. The npad is the page; a strip of status chips sits under it and the event log folds away below. */
/* A single dark look: the npad sits under a soft spotlight on a near-black stage. */
:root {
  color-scheme: dark;
  --bg: #0c0d10;
  --stage-hi: #22252d;
  --panel: #15171c;
  --fg: #e9ebf0;
  --muted: #959cab;
  --line: #262a33;
  --accent: #5b78ff;
  --ok: #4fd08a;
  --ok-soft: #133624;
  --warn: #f0b45a;
  --warn-soft: #3a2a10;
  /* flat fallback drawing of the device */
  --case: #1d1e22;
  --case-hi: #2a2c31;
  --cap: #2d2f35;
  --cap-hi: #3a3d44;
  --glow: #3d63ff;
  --glyph: #f2f3f5;
  --font-display: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
/* minimal scrollbars: a thin, faint thumb with no track, brighter on hover */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--fg) 18%, transparent) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--fg) 18%, transparent); border-radius: 3px; }
*::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--fg) 32%, transparent); }
/* Layout: one screen, no page scroll. Top bar; the render fills the left; panels stack on the right. */
html, body { height: 100%; }
body { margin: 0; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
}
.app {
  height: 100%; display: grid; gap: 12px 0; padding: 14px 16px 0;   /* the render runs to the window's bottom edge */
  grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr);
}
.topbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; margin: 0; line-height: 1.1;
  display: inline-flex; align-items: center; gap: 9px; }
/* the npad from above, to scale, as a silhouette: the case with the knob and keycaps picked out by their gaps */
h1 .logo { width: 17px; height: 23px; flex: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* The sidebar opens by animating its width (the render resizes and the model glides to its new
   centre), while the panels inside slide in from the right one after another. */
.side { width: 356px; min-height: 0; overflow: hidden; display: flex; justify-content: flex-end;
  transition: width .5s cubic-bezier(.25, .8, .25, 1); }
.side-inner { width: 344px; padding-right: 4px; padding-bottom: 16px; box-sizing: border-box;   /* the gap under the last card scrolls with it */
  flex: none; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.side-inner > * { flex: none; }
/* cards fade out at an edge only while there's more to scroll to on that side */
.side-inner { --fade-top: 0px; --fade-bottom: 0px;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent);
          mask-image: linear-gradient(to bottom, transparent, #000 var(--fade-top), #000 calc(100% - var(--fade-bottom)), transparent); }
.side-inner.more-above { --fade-top: 28px; }
.side-inner.more-below { --fade-bottom: 28px; }
.side-inner > * { transition: transform .5s cubic-bezier(.2, .9, .25, 1), opacity .35s ease; }
.side-inner > :nth-child(n+2) { transition-delay: 60ms; }
.app.collapsed .side { width: 0; }
.app.collapsed .side-inner > * { transform: translateX(48px); opacity: 0; transition-delay: 0s; transition-duration: .3s; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-rows: auto minmax(0, 1fr) auto; }
  .side { width: auto; height: 46vh; padding-top: 12px; transition-property: height, padding; }
  .side-inner { width: 100%; }
  .app.collapsed .side { width: auto; height: 0; padding-top: 0; }
  .app.collapsed .side-inner > * { transform: translateY(32px); }
}
@media (prefers-reduced-motion: reduce) { .side, .side-inner > *, .side-tab .pane { transition: none !important; } }
button {
  font: inherit; font-weight: 500; font-size: 13px; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible, .cap:focus-visible, .knob-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
/* draws the eye to the connect button when someone tries to remap without an npad */
#btn-hid.nudge { animation: nudge .5s ease 2; }
@keyframes nudge { 50% { transform: scale(1.06); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { #btn-hid.nudge { animation: none; } }
/* short messages over the render: connection errors, browser support */
.toast {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3; margin: 0;
  width: max-content; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-size: 13px; text-align: center;
}
.toast[data-kind="warn"] { background: var(--warn-soft); border-color: transparent; color: var(--warn); }



/* ---------- the device ---------- */
.stage { position: relative; min-height: 0; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(ellipse 55% 55% at 50% 50%, var(--stage-hi), transparent 75%); }
.npad {
  width: min(400px, 100%); position: relative;
  background: linear-gradient(160deg, var(--case-hi), var(--case) 45%);
  border-radius: 22px;
  box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 24px 40px -18px rgba(0,0,0,.55), 0 4px 10px rgba(0,0,0,.25);
  /* height comes from the knob and the key well, so nothing can spill out */
  display: flex; flex-direction: column; gap: 28px; padding: 36px 28px 30px; border-radius: 26px;
}
.cable { position: absolute; top: -26px; left: 50%; width: 22px; height: 30px; transform: translateX(-50%);
  background: var(--case); border-radius: 4px 4px 2px 2px; }
.knob-zone { display: grid; place-items: center; position: relative; padding-inline: 40px; }
.knob-btn { all: unset; box-sizing: border-box; cursor: pointer; border-radius: 50%; width: min(190px, 100%); aspect-ratio: 1; display: grid; place-items: center; position: relative; }
.knob {
  width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #3a3c42, #1b1c20 70%);
  box-shadow: 0 0 0 5px #141518, 0 10px 18px rgba(0,0,0,.55), inset 0 2px 1px rgba(255,255,255,.07);
  transition: transform .18s cubic-bezier(.3,.7,.4,1);
  position: relative;
}
.knob::after { /* the finger dimple */
  content: ""; position: absolute; width: 24%; aspect-ratio: 1; border-radius: 50%;
  left: 50%; top: 9%; transform: translateX(-50%);
  background: radial-gradient(circle at 40% 35%, #2c2e33, #111214);
  box-shadow: inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05);
}
.knob-btn.down .knob { box-shadow: 0 0 0 5px #141518, 0 0 0 9px var(--glow), 0 4px 10px rgba(0,0,0,.5), inset 0 2px 1px rgba(255,255,255,.07); }
.turn { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 13px;
  color: var(--glyph); opacity: .18; transition: opacity .3s; display: grid; justify-items: center; gap: 2px; }
.turn svg { width: 22px; height: 22px; }
.turn.left { left: 0; } .turn.right { right: 0; }
.turn.flash { opacity: 1; transition: none; color: #9fb3ff; }
.turn .led, .knob-led { width: 6px; height: 6px; border-radius: 50%; background: #3b3e45; }
.turn .led.ok, .knob-led.ok { background: #4fd08a; box-shadow: 0 0 6px #4fd08a; }
.knob-led { position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%); }

.well {
  border-radius: 12px; padding: 10px;
  background: #0b0c10;
  box-shadow: 0 0 0 2px #23252b, 0 0 22px -2px rgba(61,99,255,.55), inset 0 0 18px rgba(61,99,255,.5);
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
}
.cell { min-width: 0; border-radius: 6px; aspect-ratio: 1; display: grid; place-items: center;
  background: radial-gradient(circle, rgba(61,99,255,.55), rgba(61,99,255,.15) 70%); transition: background .25s; }
.cell.down { background: radial-gradient(circle, rgba(140,165,255,1), rgba(61,99,255,.7) 75%); transition: none; }
.cap {
  all: unset; box-sizing: border-box; cursor: pointer; position: relative;
  width: 86%; aspect-ratio: 1; border-radius: 7px;
  background: linear-gradient(180deg, var(--cap-hi), var(--cap));
  box-shadow: 0 3px 0 #17181c, 0 4px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  display: grid; place-items: center; color: var(--glyph);
  transition: transform .12s, box-shadow .12s;
}
.cap svg { width: 40%; height: 40%; }
.cap .n { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 8vw, 40px); line-height: 1; margin-top: -8%; }
.cell.down .cap { transform: translateY(3px); box-shadow: 0 0 0 #17181c, 0 1px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.cap .led { position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: #474a52; }
.cap .led.ok { background: #4fd08a; box-shadow: 0 0 6px #4fd08a; }
.target .cap, .knob-btn.target { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px #9fb3ff; }
@media (prefers-reduced-motion: reduce) {
  .knob { transition: none; }
}
.npad3d { position: absolute; inset: 0; }
/* small credit in the render's lower-left corner */
.powered { position: absolute; left: 2px; bottom: 14px; z-index: 3; font-size: 11px; color: var(--muted); text-decoration: none; opacity: .75; transition: opacity .15s, color .15s; }
.powered:hover { opacity: 1; color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.npad3d canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: pan-y; }
/* sidebar toggle in the top bar */
.side-tab { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
/* header icon links (GitHub), sized like the sidebar button beside them */
.icon-link { display: inline-grid; place-items: center; width: 42px; align-self: stretch; color: var(--muted); border-radius: 8px; transition: color .15s, background-color .15s; }
.icon-link:hover { color: var(--fg); background: var(--panel); }
.icon-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.side-tab:hover { color: var(--fg); }
.side-tab .pane { fill: currentColor; opacity: 0; transition: opacity .25s; }
.side-tab[aria-expanded="true"] { color: var(--fg); }
.side-tab[aria-expanded="true"] .pane { opacity: .55; }

/* ---------- status chips ---------- */
  all: unset; box-sizing: border-box; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  padding: 3px 10px; border-radius: 8px; border: 1px solid transparent; font-size: 13px;
}

/* ---------- sidebar tabs ---------- */
.tabpanel { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); font-size: 12px; margin: 0; padding: 10px 14px; }

/* keymap */
.seg { display: flex; gap: 2px; }
.seg button, .mods button, .cats button { padding: 3px 9px; font-size: 12px; }
[aria-pressed="true"]:is(.seg button, .mods button, .cats button, .key) { background: var(--accent); border-color: var(--accent); color: #fff; }

.panel.picker { flex: 1 1 0; min-height: 200px; display: flex; flex-direction: column; } /* fills what's left; its keys scroll */
.pick-current { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.pick-tools { display: flex; gap: 8px; padding: 8px 10px 0; }
.pick-tools input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
.mods { display: flex; gap: 2px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 4px; padding: 8px 10px 10px; overflow: auto; min-height: 0; flex: 1 1 auto; align-content: start; }
.key { padding: 6px 4px; font-size: 12px; line-height: 1.2; min-height: 34px; display: grid; place-items: center; text-align: center; word-break: break-word; }
.key small { display: block; font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
.key[aria-pressed="true"] small { color: #fff; }
button:disabled { opacity: .45; cursor: default; }

/* ---------- config mode: flags over the model, picker popover, layer/actions bar ---------- */
.flags, .flag-lines { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .25s; }
.flags.on, .flag-lines.on { opacity: 1; transition-delay: .2s; }
.flag-lines { width: 100%; height: 100%; overflow: visible; }
.flag-lines path { fill: none; stroke: color-mix(in srgb, var(--fg) 45%, transparent); stroke-width: 1; }
.flag-lines circle { fill: var(--fg); }
.flag-lines .sel path { stroke: var(--accent); }
.flag-lines .sel circle { fill: var(--accent); }
.flag { position: absolute; display: grid; gap: 1px; padding: 3px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0,0,0,.35); pointer-events: auto; }
.flags:not(.on) .flag { pointer-events: none; }
.flag-row { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 0; padding: 4px 6px; border-radius: 6px; }
.flag-row:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.flag-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.flag-row[aria-pressed="true"] { background: transparent; }
.flag-icon { transition: color .6s ease, filter .6s ease; }
.flag-icon.ok { color: color-mix(in srgb, var(--accent) 55%, #fff); }
.flag-row.hit .flag-icon { color: var(--accent); filter: drop-shadow(0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent)); transition: none; }
.flag-row { position: relative; }
.flag-row { grid-template-columns: auto auto minmax(0, 1fr) !important; align-items: center; column-gap: 8px !important; }
.flag-keys { display: inline-flex; align-items: center; gap: 4px; justify-self: start; min-width: 0; }
.flag-plus { font-size: 11px; color: var(--muted); }
.flag-arrow { display: block; color: var(--muted); }
.flag-row:hover .flag-plus { color: var(--fg); }
.flag-icon { display: grid; place-items: center; color: color-mix(in srgb, var(--fg) 70%, transparent); }
.flag-icon svg { display: block; width: 28px; height: 28px; }   /* as tall as the mapping field beside it */
.flag-name { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.flag-code { /* the mapping drawn as a little keycap top, like the icon beside it: same height, outline,
  corner radius and inset; its width snaps to the text, and a single character makes a square cap */
  display: inline-block; justify-self: start; text-align: center; line-height: 26.8px; vertical-align: middle;   /* block, so a long label ends in … inside the padding */
  height: 28px; min-width: 28px; width: max-content; max-width: 168px; padding: 0 7px; box-sizing: border-box;
  border: 0.6px solid color-mix(in srgb, var(--fg) 70%, transparent); border-radius: 7.5px; background: transparent;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: border-color .15s, color .15s; }
.flag-row:hover .flag-code { border-color: var(--fg); }
.flag-row[aria-pressed="true"] .flag-code { border-color: var(--accent); color: var(--fg); }
.flag-row.recording { cursor: default; }
.flag-row.recording .flag-code { border-color: var(--accent); }   /* an empty cap waiting for a key */
.caret { display: inline-block; vertical-align: middle; width: 1.5px; height: 14px; background: var(--accent); animation: caret-blink 1.06s steps(1) infinite; }
@keyframes caret-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
.flag-input { all: unset; box-sizing: border-box; display: inline-flex; height: 28px; min-width: 28px; padding: 0 7px;
  border: 0.6px solid var(--accent); border-radius: 7.5px; color: var(--fg); caret-color: var(--accent);
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; text-align: center; }   /* typed like the key's own legend */
.suggest { position: absolute; left: 0; top: 0; z-index: 5; width: 220px; max-height: 188px; overflow: auto; padding: 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,.5); }
.suggest-head { font-size: 11px; color: var(--muted); padding: 6px 8px 4px; }
.suggest-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.suggest-row[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.suggest-label { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest-cat { font-size: 11px; color: var(--muted); flex: none; }
.flag-row[aria-pressed="true"] .flag-name { color: color-mix(in srgb, #fff 75%, transparent); }
.popover { position: absolute; left: 0; top: 0; z-index: 4; width: 320px; max-width: calc(100% - 24px); height: min(430px, calc(100% - 24px));
  display: flex; flex-direction: column; filter: drop-shadow(0 12px 28px rgba(0,0,0,.5)); }
.popover .panel.picker { flex: 1 1 auto; min-height: 0; }

.light-grid { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px 10px; align-items: center; padding: 10px 14px 12px; }
.light-grid label { font-size: 12px; color: var(--muted); }
.light-grid select { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; min-width: 0; }
/* sliders drawn for the dark card: a slim dark track (filled in the accent for amounts), one round handle */
.light-grid input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 0; border-radius: 3px; cursor: pointer;
  background: linear-gradient(90deg, var(--accent) var(--fill, 0%), color-mix(in srgb, var(--fg) 12%, transparent) var(--fill, 0%)); }
.light-grid input.hue { background: linear-gradient(90deg, hsl(0 80% 56%), hsl(60 80% 56%), hsl(120 80% 50%), hsl(180 80% 50%), hsl(240 80% 62%), hsl(300 80% 60%), hsl(360 80% 56%)); }
.light-grid input.sat { background: linear-gradient(90deg, color-mix(in srgb, var(--fg) 85%, transparent), var(--sat-end, hsl(0 80% 56%))); }
.light-grid input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--fg); border: 2px solid var(--panel); box-shadow: 0 0 0 1px rgb(0 0 0 / .35), 0 1px 3px rgb(0 0 0 / .4); transition: transform .12s; }
.light-grid input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--fg); border: 2px solid var(--panel); box-shadow: 0 0 0 1px rgb(0 0 0 / .35); }
.light-grid input[type="range"]::-moz-range-track { background: transparent; }
.light-grid input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
.light-grid input[type="range"]:focus-visible { outline: none; }
.light-grid input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--accent); }
.light-grid input[type="range"]:disabled { cursor: default; }
.light-grid :disabled { opacity: .35; }
.light-swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); }
.layout-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
.layout-actions button { font-size: 12px; padding: 6px 8px; }
.log-panel { display: flex; flex-direction: column; }
.log { font-family: var(--font-mono); font-size: 11px; height: 180px; overflow: auto; }
.log table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.log th, .log td { text-align: left; padding: 3px 10px 3px 0; white-space: nowrap; }
.log th:first-child, .log td:first-child { padding-left: 14px; }
.log th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); }
.log td.m { color: var(--accent); }
.log td.u { color: var(--muted); }
.log .empty td { color: var(--muted); font-family: var(--font-body); padding-block: 10px; white-space: normal; }

/* macros */
.meter { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.meter.over { color: var(--warn); }
.macro-empty { margin: 4px 0 8px; font-size: 12px; }
.macro-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
/* macro tabs are drawn like the flags' keycap tops: same height, hairline outline, corner radius and type */
.macro-tabs button { height: 28px; min-width: 28px; padding: 0 7px; background: transparent; color: var(--fg);
  border: 0.6px solid color-mix(in srgb, var(--fg) 70%, transparent); border-radius: 7.5px;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; transition: border-color .15s, color .15s;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }   /* the flags' text renders this way (they float in their own layer) */
.macro-tabs button:hover:not(:disabled) { border-color: var(--fg); }
.macro-tabs [aria-selected="true"], .macro-tabs [aria-selected="true"]:hover { border-color: var(--accent); }   /* like a selected flag */
.macro-tabs .macro-add { font-family: var(--font-body); font-size: 12px; color: var(--muted); border-style: dashed; border-color: color-mix(in srgb, var(--fg) 35%, transparent); }
.macro-tabs .macro-add:hover:not(:disabled) { color: var(--fg); border-color: var(--fg); }
.macro-rows { padding: 2px 10px 10px; }
/* the selected macro's builder: a section under the tab row, set off by a hairline and a small heading */
.macro-editor { border-top: 1px solid var(--line); }
.macro-sub { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 14px; }
.macro-sub h3 { margin: 0; font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; color: var(--muted); }
.macro-rows > .macro-empty { margin: 2px 4px; }
#macro-del { width: 26px; height: 26px; }
#macro-del:hover { color: var(--warn); }
.icon-btn { width: 24px; height: 24px; padding: 0; border: 0; background: none; color: var(--muted); display: grid; place-items: center; border-radius: 6px; }
.icon-btn:hover { color: var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent); }
.steps { display: grid; gap: 2px; }
/* each step reads as a sentence: a verb, then its value as an inline token (no box until you point at it) */
.step { display: grid; grid-template-columns: 14px minmax(0, 1fr) 24px; gap: 6px; align-items: center; min-height: 34px; border-radius: 8px; }
.step .icon-btn { opacity: 0; transition: opacity .15s; }
.step:hover .icon-btn, .step:focus-within .icon-btn { opacity: 1; }
.grip { display: grid; place-items: center; height: 28px; color: var(--muted); fill: currentColor; cursor: grab; opacity: .5; }
.step:hover .grip { opacity: 1; }
.step.dragging { opacity: .4; }
.step.drop-before { box-shadow: 0 -2px 0 var(--accent); }
.step.drop-after { box-shadow: 0 2px 0 var(--accent); }
.step-body { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13.5px; }
.step-type { color: var(--fg); font-weight: 500; flex: none; }
.step-body input { field-sizing: content; min-width: 4ch; max-width: 100%; height: 26px; box-sizing: border-box; padding: 0 7px;
  font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); background: color-mix(in srgb, var(--accent) 16%, transparent);
  border: 1px solid transparent; border-radius: 6.5px; outline: none; transition: border-color .15s, background-color .15s;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.step-body input:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.step-body input:focus { border-color: var(--accent); background: transparent; }
.step-body input::placeholder { color: var(--muted); }
.step-text { min-width: 8ch; }
.step-ms { text-align: right; }
.step-body .unit { color: var(--muted); }
.step-cap { padding: 0; border: 0; background: none; display: flex; border-radius: 8px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
.step-cap:hover .flag-code { border-color: var(--fg); }
.step-cap.recording .flag-code { border-color: var(--accent); }
.step-add { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0 0 20px; }
.steps:empty { display: none; }
.steps:empty + .step-add { padding: 0; }   /* a new macro: just the add buttons, in line with the tabs */
.step-add button { padding: 3px 9px; font-size: 12px; color: var(--muted); background: none; border: 1px dashed var(--line); }
.step-add button:hover { color: var(--fg); border-color: var(--muted); }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; flex: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--line); min-height: 36px; }
.panel-head:last-child { border-bottom: 0; }   /* a card that's only a header (Layer) has no divider */
.panel h2 { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel-head button { padding: 4px 10px; font-size: 12px; }
.panel-foot { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
.panel-foot button { flex: 1; padding: 5px 10px; font-size: 12px; }
[hidden] { display: none !important; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 3D model of the npad (momokai Aurora). Units are millimetres, measured from
// momokai's product photos using the 19.05 mm key pitch as the scale.
window.initDevice3D = function (host, { pick, icons }) {
  if (!window.THREE) throw new Error('three.js did not load');
  const T = THREE;
  const W = 73, D = 98, H = 18, R = 5;                       // case
  // keycaps: 18.1 mm at the base on a 19.05 mm pitch, so neighbours sit about 1 mm apart
  const PITCH = 19.05, CAP_BASE = 18.1, CAP_Y = H - 2.5, TRAVEL = 3.5; // caps stand ~6.6 mm proud of the case
  // key pocket: caps span 56.2 × 37.2 mm, leaving about a 1 mm gap to the pocket wall
  const WELL_W = 58, WELL_D = 39, WELL_Z = 21, FLOOR = H - 10;
  const KNOB_R = 15.5, KNOB_H = 12.2, KNOB_Z = -20, KNOB_SINK = 3; // sits in a round recess, ~9.2 mm proud (from side photos)
  const srgb = hex => new T.Color(hex).convertSRGBToLinear();

  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  const scene = new T.Scene();

  // A small studio for the anodized aluminium to reflect.
  const pmrem = new T.PMREMGenerator(renderer);
  const studio = new T.Scene();
  studio.add(new T.Mesh(new T.BoxGeometry(100, 100, 100), new T.MeshBasicMaterial({ color: 0x24262c, side: T.BackSide })));
  const softbox = (w, h, x, y, z, c) => {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: c, side: T.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); studio.add(m);
  };
  softbox(70, 25, 0, 45, 5, 0xffffff);
  softbox(30, 40, -45, 15, 25, 0xc9d2ff);
  softbox(30, 30, 45, 10, -25, 0x9a9a9a);
  scene.environment = pmrem.fromScene(studio, 0.04).texture;

  scene.add(new T.HemisphereLight(0xe4e9ff, 0x0d0e12, 0.18));
  const sun = new T.DirectionalLight(0xffffff, 1.0);
  sun.position.set(-70, 170, 90);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 20, far: 450 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0008;
  sun.shadow.radius = 5;
  scene.add(sun);
  // The same light without shadows. Shifting intensity between the two fades every shadow in or out
  // smoothly (used by the exploded view) without changing how bright anything is.
  const sunFlat = new T.DirectionalLight(0xffffff, 0);
  sunFlat.position.copy(sun.position);
  scene.add(sunFlat);
  const SUN = sun.intensity, GROUND_SHADOW = 0.35;
  // low fill from the right so the sides (and the knob's knurl) aren't lost in shadow
  const fill = new T.DirectionalLight(0xdfe4ff, 0.45);
  fill.position.set(160, 50, 40);
  scene.add(fill);
  const rim = new T.DirectionalLight(0xcfd8ff, 0.6);
  rim.position.set(-40, 90, -220);
  scene.add(rim);

  const ground = new T.Mesh(new T.PlaneGeometry(800, 800), new T.ShadowMaterial({ opacity: 0.35 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2; // the npad stands on 2 mm rubber feet
  ground.receiveShadow = true;
  scene.add(ground);

  function roundRect(path, cx, cy, w, h, r) {
    const x = cx - w / 2, y = cy - h / 2;
    path.moveTo(x + r, y);
    path.lineTo(x + w - r, y); path.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
    path.lineTo(x + w, y + h - r); path.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    path.lineTo(x + r, y + h); path.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    path.lineTo(x, y + r); path.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    return path;
  }
  // Extrude a flat outline upward: shape x -> x, shape y -> -z, depth -> +y
  function extrudeUp(shape, height, bevel, segs = 3) {
    const g = new T.ExtrudeGeometry(shape, {
      depth: height - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
      bevelSegments: segs, curveSegments: 16,
    });
    g.rotateX(-Math.PI / 2);
    g.translate(0, bevel, 0);
    return g;
  }

  // ---- case ----
  // matte, bead-blasted black aluminium
  const aluminium = new T.MeshStandardMaterial({ color: srgb(0x1c1c1f), metalness: 0.25, roughness: 0.72, envMapIntensity: 0.6 });
  const PLATE = 1.4; // bottom plate, slightly inset, leaves a seam line
  const caseShape = roundRect(new T.Shape(), 0, 0, W - 1.6, D - 1.6, R);
  caseShape.holes.push(roundRect(new T.Path(), 0, -WELL_Z, WELL_W + 2, WELL_D + 2, 2.5));
  caseShape.holes.push(new T.Path().absarc(0, -KNOB_Z, KNOB_R + 1.6, 0, Math.PI * 2, true));
  const caseGeo = extrudeUp(caseShape, H - PLATE, 0.8, 1);
  caseGeo.translate(0, PLATE, 0);
  const caseMesh = new T.Mesh(caseGeo, aluminium);
  const plate = new T.Mesh(extrudeUp(roundRect(new T.Shape(), 0, 0, W - 1.6 - 5, D - 1.6 - 5, R - 2.5), PLATE - 0.15, 0.3, 1),
    new T.MeshStandardMaterial({ color: srgb(0x111113), metalness: 0.25, roughness: 0.8 }));
  [caseMesh, plate].forEach(m => { m.castShadow = m.receiveShadow = true; });
  scene.add(caseMesh);
  // The build under the top shell, as in momokai's exploded render: PCB (with the encoder), sound-
  // dampening foam, and the aluminium bottom plate (with the feet). Hidden inside the shell when
  // assembled; in the exploded view they drop away in even steps.
  const BASE = { pcb: 20, foam: 32, bottom: 44 };
  const SWITCH_GAP = 7;                                        // mm between a lifted switch and its keycap's lift
  const pcbLayer = new T.Group(), foamLayer = new T.Group(), bottomLayer = new T.Group();
  scene.add(pcbLayer, foamLayer, bottomLayer);
  bottomLayer.add(plate);
  const floorMat = new T.MeshStandardMaterial({ color: srgb(0x1b1b20), roughness: 0.75 }); // plate: dark, but catches the LED light
  // inner layers sit inside the shell's walls (2.5 mm in) and share its corner radius, minus the inset
  const INSET = 5, layerShape = () => roundRect(new T.Shape(), 0, 0, W - 1.6 - INSET, D - 1.6 - INSET, R - INSET / 2);
  const pcbBoard = new T.Mesh(extrudeUp(layerShape(), 1.6, 0.2, 1), floorMat);   // dark grey that catches the LED light
  pcbBoard.position.y = FLOOR - 1.6;
  const foam = new T.Mesh(extrudeUp(layerShape(), 3, 0.4, 2), new T.MeshStandardMaterial({ color: srgb(0x2b2b30), roughness: 1 }));
  foam.position.y = PLATE + 0.5;
  [pcbBoard, foam].forEach(m => { m.castShadow = m.receiveShadow = true; });
  pcbLayer.add(pcbBoard); foamLayer.add(foam);
  // PCB details: a hot-swap socket cutout pattern under each switch, and a standoff screw at the back
  // corner, hidden under the shell when assembled (there are none between the keys)
  {
    const holeMat = new T.MeshBasicMaterial({ color: 0x060607 });
    const top = FLOOR + 0.02;
    const disc = (r, x, z) => { const m = new T.Mesh(new T.CircleGeometry(r, 20), holeMat); m.rotation.x = -Math.PI / 2; m.position.set(x, top, z); return m; };
    const slot = (w, d, x, z) => { const m = new T.Mesh(new T.PlaneGeometry(w, d), holeMat); m.rotation.x = -Math.PI / 2; m.position.set(x, top, z); return m; };
    for (let col = 0; col < 3; col++) for (let row = 0; row < 2; row++) {
      const x = (col - 1) * PITCH, z = WELL_Z + (row === 0 ? -PITCH / 2 : PITCH / 2);
      pcbLayer.add(disc(2, x, z), disc(0.85, x - 5.1, z), disc(0.85, x + 5.1, z),
        disc(1.5, x - 3.8, z - 2.5), disc(1.5, x + 2.5, z - 5), slot(2.6, 1.4, x, z + 5.2));
    }
    const screwMat = new T.MeshStandardMaterial({ color: srgb(0xb8bbc0), metalness: 0.9, roughness: 0.35 });
    const thread = new T.TorusGeometry(0.82, 0.12, 4, 16); thread.rotateX(Math.PI / 2);
    [[W / 2 - 6, -D / 2 + 9]].forEach(([x, z]) => {
      const screw = new T.Group();
      const body = new T.Mesh(new T.CylinderGeometry(0.8, 0.8, 5, 16), screwMat); body.position.y = 2.5; screw.add(body);
      for (let i = 0; i < 7; i++) { const r = new T.Mesh(thread, screwMat); r.position.y = 1 + i * 0.55; screw.add(r); }
      screw.position.set(x, FLOOR, z);
      pcbLayer.add(screw);
    });
  }
  // four screws standing up from the bottom plate's corners (they thread into the shell when assembled)
  {
    const screwMat = new T.MeshStandardMaterial({ color: srgb(0xb8bbc0), metalness: 0.9, roughness: 0.35 });
    const shaft = new T.CylinderGeometry(0.8, 0.8, 6, 16);

        QMK_LEDS.forEach(([, , , r, c]) => {
          const val = fx.fb[r][c];
          if (val > green) { const b2 = (boostMax * (val - green) / (maxI - green)) | 0; out.push([b2, maxI, b2]); }
          else out.push([0, (maxI * val / green) | 0, 0]);
        });
        if (fx.decay === decayTicks) fx.decay = 0;
        if (++fx.drop > 28) {
          fx.drop = 0;
          for (let r = 2; r > 0; r--) for (let c = 0; c < 3; c++) {
            if (r === 2 && fx.fb[r][c] === maxI) fx.fb[r][c]--;
            if (fx.fb[r - 1][c] >= maxI) { fx.fb[r - 1][c] = maxI - 1; fx.fb[r][c] = maxI; }
          }
        }
        void fb;
        break;
      }
      case 'solid_reactive_simple': case 'solid_reactive': {
        const maxTick = (65535 / qadd8(SP, 1)) | 0;
        QMK_LEDS.forEach((l, i) => {
          let tick = maxTick;
          for (let j = fx.hits.length - 1; j >= 0; j--) if (fx.hits[j].i === i && fx.hits[j].tick < tick) { tick = fx.hits[j].tick; break; }
          const off = Math.min(255, scale16by8(tick, qadd8(SP, 1)));
          out.push(L.effect === 'solid_reactive_simple' ? qmkHsvToRgb(reactiveHue, S, scale8(255 - off, V)) : qmkHsvToRgb(reactiveHue + scale8(255 - off, 64), S, V));
        });
        break;
      }
      case 'solid_reactive_cross': splashRun((h, s, v, dx, dy, dist, tick) => {
        let e = tick + dist; const ax = Math.min(255, Math.abs(dx) * 16), ay = Math.min(255, Math.abs(dy) * 16);
        e += Math.min(ax, ay); e = Math.min(255, e & 0xffff);
        return [reactiveHue, s, qadd8(v, 255 - e)];
      }, Math.max(0, fx.hits.length - 1)); break;
      case 'solid_reactive_nexus': splashRun((h, s, v, dx, dy, dist, tick) => {
        let e = (tick - dist) & 0xffff; if (e > 255) e = 255; if (dist > 72) e = 255;
        if ((dx > 8 || dx < -8) && (dy > 8 || dy < -8)) e = 255;
        return [H + (dy / 4 | 0), s, qadd8(v, 255 - e)];
      }, Math.max(0, fx.hits.length - 1)); break;
      case 'splash': case 'solid_splash': splashRun((h, s, v, dx, dy, dist, tick) => {
        let e = (tick - dist) & 0xffff; if (e > 255) e = 255;
        return [L.effect === 'splash' ? h + e : h, s, qadd8(v, 255 - e)];
      }, Math.max(0, fx.hits.length - 1)); break;

    }
    return out;
  }
  let frameLeds = null;                                // this frame's colours, keyed by control id (0..1)
  function computeLeds(t) {
    const L = lighting;
    if (L) {
      const rgb = qmkFrame(L, t * 1000);
      frameLeds = Object.fromEntries(QMK_LEDS.map(([id], i) => [id, rgb[i].map(c => c / 255)]));
    } else frameLeds = null;
  }
  function ledColor(k, t) {
    if (frameLeds) return frameLeds[k.id];
    // idle demo backlight (no npad lighting to mirror): white, the pressed key flashing pink
    const v = DEMO_LIGHT.v * idleGlow;
    if (v <= 0.001) return [0, 0, 0];
    const since = t - k.pressedAt, fade = since < 0 ? 0 : Math.max(0, 1 - since * (0.6 + DEMO_LIGHT.speed * 1.4));
    return hsv(DEMO_LIGHT.h, 0.55 * fade, v);
  }

  // ---- idle demo: while the model spins, it "plays" itself: key taps, knob scrolls, a knob press.
  // Purely visual: nothing here counts as a test or stops the spin.
  const demo = { next: 2.5, events: [] };
  function demoKey(id, down, t) {
    const k = keys[id];
    k.down = down; k.demo = down;
    if (down) { k.pressedAt = t; } // the idle demo's pink flash
  }
  function scheduleDemo(t) {
    const r = Math.random(), ids = Object.keys(keys);
    let at = t;
    if (r < 0.62) {                                   // one to three key taps
      for (let n = 1 + Math.floor(Math.random() * 3); n > 0; n--) {
        const id = ids[Math.floor(Math.random() * ids.length)], start = at;
        demo.events.push({ at: start, fn: tt => demoKey(id, true, tt) }, { at: start + 0.13, fn: tt => demoKey(id, false, tt) });
        at += 0.24 + Math.random() * 0.18;
      }
    } else if (r < 0.92) {                            // scroll the knob a few detents
      const dir = Math.random() < 0.5 ? 1 : -1;
      for (let n = 2 + Math.floor(Math.random() * 5); n > 0; n--) {
        demo.events.push({ at, fn: () => { knobAngle += dir * (Math.PI / 10); } });
        at += 0.09;
      }
    } else {                                          // press the knob
      demo.events.push({ at, fn: () => { knobDown = true; } }, { at: at + 0.18, fn: () => { knobDown = false; } });
      at += 0.18;
    }
    return at;
  }
  function runDemo(t) {
    if (!turntable.on || reduceMotion) return;
    if (!demo.events.length && t >= demo.next) demo.next = scheduleDemo(t) + 0.9 + Math.random() * 1.6;
    while (demo.events.length && demo.events[0].at <= t) demo.events.shift().fn(t);
    demo.events.sort((a, b) => a.at - b.at);
  }
  function stopDemo() {
    demo.events.length = 0;
    Object.values(keys).forEach(k => { if (k.demo) { k.down = false; k.demo = false; } });
    knobDown = false;
  }

  let lastT = 0;
  function frame() {
    const t = clock.getElapsedTime(), dt = Math.min(0.1, t - lastT);
    lastT = t;
    runDemo(t);
    // demo backlight: fade in while idle (after a beat), fade out once someone takes over
    const glowTarget = turntable.on && !reduceMotion && t > 0.8 ? 1 : 0;
    idleGlow += (glowTarget - idleGlow) * Math.min(1, dt * (glowTarget ? 1.2 : 3));
    // turntable: about one turn every 80 s, with eased start and stop
    turntable.speed += ((turntable.on && !turntable.held ? 0.08 : 0) - turntable.speed) * Math.min(1, dt * 1.2);
    if (Math.abs(turntable.speed) > 1e-4) {
      view.yaw += turntable.speed * dt;
      if (turntable.on && !turntable.held) {
        // follow the orbit's height and distance; eased, so resuming from another view glides into it
        const k = Math.min(1, dt * 1.5);
        view.pitch += (orbitPitch(view.yaw) - view.pitch) * k;
        view.zoom += (orbitZoom(view.yaw) - view.zoom) * k;
      }
      placeCamera();
    }
    if (turntable.goHome) {
      // quick ease (settles in about a third of a second)
      const { yaw, pitch, zoom = 1 } = turntable.target, k = Math.min(1, dt * 9);
      view.yaw += (yaw - view.yaw) * k;
      view.pitch += (pitch - view.pitch) * k;
      view.zoom += (zoom - view.zoom) * k;
      if (Math.abs(yaw - view.yaw) < 1e-3 && Math.abs(pitch - view.pitch) < 1e-3 && Math.abs(zoom - view.zoom) < 1e-3) {
        view.yaw = yaw; view.pitch = pitch; view.zoom = zoom; turntable.goHome = false;
      }
      placeCamera();
    }
    if (!viewLocked) par.to = 0;
    if (Math.abs(par.to - par.yaw) > 1e-5) { par.yaw += (par.to - par.yaw) * Math.min(1, dt * 3); placeCamera(); }
    // explode / reassemble, eased (~0.5 s), alongside the camera's turn to iso
    if (explodeT !== explodeTo) {
      explodeT += (explodeTo - explodeT) * Math.min(1, dt * 7);
      if (Math.abs(explodeTo - explodeT) < 1e-3) explodeT = explodeTo;
      // shadows fade out as the parts float (they'd land far from them as dark blobs on the case) and
      // fade back in as they settle, so nothing pops
      const sf = (1 - explodeT) ** 2;
      sun.intensity = SUN * sf; sunFlat.intensity = SUN * (1 - sf);
      ground.material.opacity = GROUND_SHADOW * sf;
      placeCamera();
    }
    // selection: shift the material itself toward blue so lighting and shading still read, plus a
    // whisper of glow; hover: a fine, slightly translucent ring
    const SEL_GLOW = 0.07, OUTLINE = 0.9;
    computeLeds(t);
    const ease = Math.min(1, dt * 10);
    Object.entries(keys).forEach(([id, k]) => {
      k.t += ((k.down ? 1 : 0) - k.t) * 0.45;
      // hover (both modes, from the model or the Controls list) outlines; selection fills
      const hoverTo = (!drag && hover.id === id) || hover.panel === id ? 1 : 0;
      k.hoverT = (k.hoverT || 0) + (hoverTo - (k.hoverT || 0)) * ease;
      k.selT = (k.selT || 0) + ((id === target ? 1 : 0) - (k.selT || 0)) * ease;
      k.group.position.y = CAP_Y - TRAVEL * k.t + explodeT * (EXPLODE.lift[id] || 0);
      // the switch (casing, stem, LED) follows its keycap up the staircase, staying a constant
      // distance below it, so every switch sits the same gap under its own cap
      const swLift = explodeT * Math.max(0, (EXPLODE.lift[id] || 0) - SWITCH_GAP);
      k.stem.position.y = CAP_Y + 3 - stemH / 2 - TRAVEL * k.t + swLift;
      k.housing.position.y = FLOOR + swLift;
      k.lowerHousing.position.y = FLOOR - 2.6 + swLift;
      k.ledDot.position.y = FLOOR + 0.5 + swLift;
      k.ledLight.position.y = FLOOR + 2 + swLift;
      k.outlineMat.opacity = OUTLINE * k.hoverT;
      k.mat.color.copy(CAP_COLOR).lerp(CAP_SELECTED, k.selT);
      k.mat.emissiveIntensity = SEL_GLOW * k.selT;
      const [r, g, b] = ledColor(k, t);
      const lit = Math.max(r, g, b);
      k.ledLin.setRGB(r, g, b).convertSRGBToLinear();
      k.ledDotMat.color.copy(k.ledLin).multiplyScalar(4);
      // the clear top housing carries the LED's light: it glows with its colour and reads more solid when lit
      k.housingMat.emissive.copy(k.ledLin).multiplyScalar(0.4);
      k.housingMat.opacity = 0.42 + 0.2 * lit;
      k.ledLight.color.setRGB(r, g, b);
      k.ledLight.intensity = 8 * lit;
    });
    knobShown += (knobAngle - knobShown) * Math.min(1, dt * 22);   // catches up within ~0.1 s, even on fast spins
    spinner.rotation.y = -knobShown;
    shaft.rotation.y = -knobShown;
    knobT += ((knobDown ? 1 : 0) - knobT) * 0.45;
    const knobHoverTo = (!drag && hover.id === 'press') || ['cw', 'ccw', 'press'].includes(hover.panel) ? 1 : 0;
    knobHoverT += (knobHoverTo - knobHoverT) * ease;
    knob.position.y = H - KNOB_SINK - 1.2 * knobT + explodeT * EXPLODE.knob;
    encoder.position.y = FLOOR + explodeT * Math.max(0, EXPLODE.knob - SWITCH_GAP - 10);   // follows the knob, 10 mm further below it
    pcbLayer.position.y = -BASE.pcb * explodeT;
    foamLayer.position.y = -BASE.foam * explodeT;
    bottomLayer.position.y = -BASE.bottom * explodeT;
    ground.position.y = -2 - BASE.bottom * explodeT;
    shaft.position.y = ENC.bodyH + ENC.bushH - 1.2 * knobT;      // the encoder's push switch
    knobSelT += ((['cw', 'ccw', 'press'].includes(target) ? 1 : 0) - knobSelT) * ease;
    knobOutlineMat.opacity = OUTLINE * knobHoverT;
    knobSide.color.copy(KNOB_SIDE_COLOR).lerp(KNOB_SELECTED, knobSelT);
    knobTop.color.copy(KNOB_TOP_COLOR).lerp(KNOB_SELECTED, knobSelT);
    knobSide.emissiveIntensity = knobTop.emissiveIntensity = SEL_GLOW * knobSelT;

  }
  requestAnimationFrame(frame);

  return {
    press(id, down) {
      if (id === 'press') { knobDown = down; return; }
      const k = keys[id];
      if (!k) return;
      if (down && !k.down) {
        const t = clock.getElapsedTime();
        k.pressedAt = t; qmkHit(id);
      }
      k.down = down;
    },
    setLighting(state) { lighting = state; },
    turn(dir) { knobAngle += dir * (Math.PI / 10); },
    reset() { knobAngle = 0; },
    setTarget(id) { target = id; },
    setHover(id) { hover.panel = id; },          // highlight a control from outside (the Controls list)
    // where each control sits on screen (px within the canvas), for the config-mode flags, plus the
    // device's on-screen bounds; anchors are the keycap tops and the knob's top edge facing the viewer
    anchors() {
      const w = canvas.clientWidth, h = canvas.clientHeight, v = new T.Vector3();
      const toScreen = (p, cam = camera) => { p.project(cam); return { x: (p.x + 1) / 2 * w, y: (1 - p.y) / 2 * h }; };
      const out = {};
      // Each control's outer silhouette corners, halfway up its side: the leftmost and rightmost points
      // on screen. Flags are placed level with these at rest (so they stay still while a key is
      // pressed) and pointers run straight across to the live corner.
      const sil = (obj, pts, dy, cam) => {
        const sp = pts.map(([x, y, z]) => toScreen(obj.localToWorld(v.set(x, y + dy, z)), cam));
        const l = sp.reduce((m, p) => p.x < m.x ? p : m), r = sp.reduce((m, p) => p.x > m.x ? p : m);
        return { l: { ...l }, r: { ...r } };
      };
      // keycap corners at mid-height (the walls slant, so the half-width there is between base and top)
      const mid = CAP.height / 2, hwm = (CAP.base + CAP.topX + CAP.fillet * 0.8) / 2 * 0.92;
      const capCorners = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([sx, sz]) => [sx * hwm, mid, sz * hwm]);
      Object.entries(keys).forEach(([id, k]) => {
        const rest = sil(k.group, capCorners, TRAVEL * k.t, baseCam), live = sil(k.group, capCorners, 0, camera);
        out[id] = { rest, live };
      });

      // made the flag hop between neighbours as the view moved): for each camera, the edge points sit
      // at ±radius along the horizontal direction square to the line of sight to the knob's axis.
      const knobEdge = (cam, dy) => {
        const c = knob.localToWorld(new T.Vector3(0, KNOB_H / 2 + dy, 0));
        const side = new T.Vector3(cam.position.z - c.z, 0, c.x - cam.position.x).normalize().multiplyScalar(KNOB_R);
        const a = toScreen(c.clone().add(side), cam), b = toScreen(c.clone().sub(side), cam);

      };

      out.exploded = explodeT;
      const pts = [];
      for (const x of [-W / 2, W / 2]) for (const z of [-D / 2, D / 2]) for (const y of [0, H + KNOB_H]) pts.push(toScreen(v.set(x, y, z), baseCam));
      out.box = { l: Math.min(...pts.map(p => p.x)), r: Math.max(...pts.map(p => p.x)), t: Math.min(...pts.map(p => p.y)), b: Math.max(...pts.map(p => p.y)) };
      out.settled = !turntable.goHome;
      return out;
    },
    // 'interaction': stop the preview and ease to the iso working view.
    // 'preview': orbit (gliding in from the current view), demo taps and demo backlight.
    setMode(mode) {
      viewLocked = mode === 'interaction';
      explodeTo = mode === 'interaction' && !reduceMotion ? 1 : 0;
      if (reduceMotion) { explodeT = mode === 'interaction' ? 1 : 0; explodeTo = explodeT; }
      if (mode === 'interaction') { snapToIso(); return; }
      if (reduceMotion || turntable.on) return;
      turntable.goHome = false;
      turntable.on = true;
      demo.next = clock.getElapsedTime() + 1.5;
    },
    setTested(set) { tested.clear(); set.forEach(id => tested.add(id)); },
    release() { Object.values(keys).forEach(k => { k.down = false; }); knobDown = false; },
  };
};

  // ---- connecting: the picker, or automatically for an npad this browser has connected before ----
  async function hidConnect() {
    if (!('hid' in navigator)) { toast('Connecting needs Chrome or Edge.', 'warn'); return; }
    try {
      const [dev] = await navigator.hid.requestDevice({ filters: [{ usagePage: 0xff60, usage: 0x61 }] });
      if (dev) await attach(dev, { edit: true });
    } catch (err) {
      if (err?.name !== 'NotFoundError') connectFailed(err); // NotFoundError: picker closed
    }
  }
  const isNpadRaw = d => d.collections?.some(c => c.usagePage === 0xff60 && c.usage === 0x61);
  async function autoConnect() {
    if (!('hid' in navigator) || hidDev) return;
    try {
      const dev = (await navigator.hid.getDevices()).find(isNpadRaw);
      if (dev) await attach(dev);
    } catch (err) { connectFailed(err); }
  }
  function connectFailed(err) {
    hidDev = null;
    toast(`Couldn't connect: ${err?.message || err}. Close the VIA app or other tabs using the npad, then try again.`, 'warn', 8000);
  }
  // edit: open edit mode once connected (connecting with the button, or plugging the npad in);
  // the quiet reconnect when the page loads stays in preview
  async function attach(dev, { edit = false } = {}) {
    if (connecting || hidDev) return;               // auto-reconnect, plug-in and the button can race
    connecting = true;
    try { await attachNow(dev); } finally { connecting = false; }
    if (edit && hidDev) setPanels(true);
  }
  async function attachNow(dev) {
    if (!dev.opened) await dev.open();
    hidDev = dev;
    dev.addEventListener('inputreport', e => hidWait && hidWait(new Uint8Array(e.data.buffer)));
    const pv = await hidQuery(0x01);                // VIA protocol version: decides the matrix reply layout
    viaProtocol = (pv[1] << 8) | pv[2];
    // read the keymap (all layers), knob and macros, so key events line up with the npad and the
    // Keymap and Macros tabs can edit them
    await loadDeviceState();
    devLayer.reset();
    relearnMap();
    renderEditor();
    setConnectedUI(true);
    await refreshLighting();
    pollMatrix(++pollGen);
    render();
  }
  // sidebar edge fades: on when there's more to scroll to that way
  {
    const el = $('.side-inner');
    const fades = () => {
      el.classList.toggle('more-above', el.scrollTop > 1);
      el.classList.toggle('more-below', el.scrollTop + el.clientHeight < el.scrollHeight - 1);
    };
    el.addEventListener('scroll', fades, { passive: true });
    new ResizeObserver(fades).observe(el);
    new MutationObserver(fades).observe(el, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden'] });
    fades();
  }
  function setConnectedUI(on) {
    $('#btn-hid').hidden = on;                      // to disconnect, unplug it (the page notices and reconnects on replug)
    $('#btn-panels').hidden = !on;
  }
  async function pollMatrix(gen) {
    if (!hidDev || gen !== pollGen) return;         // only the latest connection's loop keeps polling
    try {
      // VIA protocol 12+ pages the matrix: the request carries a row offset (0 here), echoed back
      // before the row bytes, so rows start one byte later than in older firmware
      const r = await hidQuery(VIA.getValue, VIA.matrixState, 0);
      const at = viaProtocol >= 12 ? 3 : 2;
      const rows = [r[at], r[at + 1], r[at + 2]];
      INPUTS.forEach(i => {
        if (!i.pos) return;
        const [row, col] = i.pos;
        const now = (rows[row] >> col) & 1, was = (lastMatrix[row] >> col) & 1;
        if (now !== was) { devLayer.key(i.id, !!now); activate(i.id, !!now); log(now ? 'down' : 'up', edit.ready ? labelFor(getCode(edit.layer, i.id)) : '', `row ${row} col ${col}`, i.name); }
      });
      lastMatrix = rows;
      if (++pollCount % 60 === 0) await refreshLighting(); // pick up lighting changes made on the device or in VIA
    } catch (err) {
      if (!hidDev?.opened) { hidDisconnect(); return; }
    }
    hidTimer = setTimeout(() => pollMatrix(gen), 15);
  }
  function hidDisconnect() {
    clearTimeout(hidTimer);
    if (hidDev?.opened) hidDev.close().catch(() => {});
    hidDev = null; lastMatrix = [0, 0, 0]; pollGen++;
    lightingText = ''; dev3d?.setLighting(null);
    Object.assign(light, { ok: false, original: null }); renderLighting();
    clearTimeout(edit.macroTimer); edit.ready = false;
    setPanels(false);                             // nothing attached: back to preview, sidebar hidden
    setConnectedUI(false);
    render();

  const MOD_NAMES = [['LCTL', 0x01], ['C', 0x01], ['LSFT', 0x02], ['S', 0x02], ['LALT', 0x04], ['A', 0x04], ['LGUI', 0x08], ['LCMD', 0x08],

  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

  const PICKER = [

  const edit = {
    ready: false, layers: 0, keymap: [], enc: [],               // keymap[layer][row * 3 + col]; enc[layer] = [ccw, cw]
    original: null, undo: [], layer: 0, ctrl: null, more: false, mods: 0, cat: 'Media', query: '',
    macroCount: 0, macroSize: 0, macros: [], draft: [], macroTimer: null, macroState: '',
  };
  const idxOf = i => i.pos[0] * 3 + i.pos[1];

  // ---- the npad's active layer, worked out like QMK does from the switch presses we read and the
  // keymap we loaded (stock VIA can't report it): MO/LT hold a layer, TG toggles, TO switches,
  // TT holds or toggles on a tap, OSL holds for the next key, DF sets the default ----
  const devLayer = {
    def: 0, on: 0, held: {}, oneShot: null,
    top() { const m = (1 << this.def) | this.on; return 31 - Math.clz32(m || 1); },
    codeAt(id) {                                   // what a key does now: highest active layer that isn't transparent
      const m = (1 << this.def) | this.on;
      for (let l = edit.layers - 1; l >= 0; l--) if ((m >> l) & 1) { const c = getCode(l, id); if (c !== 0x01) return c; }
      return getCode(0, id);
    },
    reset() { this.def = 0; this.on = 0; this.held = {}; this.oneShot = null; },
    key(id, down) {
      if (!edit.ready) return;
      const before = this.top();
      if (down) {
        const c = this.codeAt(id);
        const fn = Object.entries(LAYER_FNS).find(([, b]) => c >= b && c <= b + 0x1f), n = fn ? c - fn[1] : (c >= QK_LT && c <= 0x4fff ? (c >> 8) & 0xf : -1);
        if (this.oneShot != null && !(fn && fn[0] === 'OSL')) { const l = this.oneShot; this.oneShot = null; this.on &= ~(1 << l); }
        if (fn?.[0] === 'MO' || (c >= QK_LT && c <= 0x4fff)) { this.held[id] = n; this.on |= 1 << n; }
        else if (fn?.[0] === 'TG') this.on ^= 1 << n;
        else if (fn?.[0] === 'TO') this.on = 1 << n;
        else if (fn?.[0] === 'DF') this.def = n;
        else if (fn?.[0] === 'OSL') { this.oneShot = n; this.on |= 1 << n; }
        else if (fn?.[0] === 'TT') { this.held[id] = n; this.on |= 1 << n; }   // held like MO (toggling needs 5 taps)
      } else if (id in this.held) {
        const n = this.held[id]; delete this.held[id];
        this.on &= ~(1 << n);
      }
      const after = this.top();
      if (after !== before) { edit.layer = after; renderKeymap(); render(); }
    },
  };
  const getCode = (layer, id) => byId[id].pos ? edit.keymap[layer]?.[idxOf(byId[id])] : edit.enc[layer]?.[id === 'cw' ? 1 : 0];
  const clone = v => JSON.parse(JSON.stringify(v));

  // ---- reading everything off the npad on connect ----
  async function loadDeviceState() {
    edit.ready = false;
    const layers = (await hidQuery(0x11))[1];
    edit.keymap = []; edit.enc = [];
    for (let l = 0; l < layers; l++) {
      const row = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const d = await hidQuery(0x04, l, r, c); row.push((d[4] << 8) | d[5]); }
      edit.keymap.push(row);
      const ccw = await hidQuery(0x14, l, 0, 0), cw = await hidQuery(0x14, l, 0, 1);
      edit.enc.push([(ccw[4] << 8) | ccw[5], (cw[4] << 8) | cw[5]]);
    }
    edit.layers = layers;
    edit.macroCount = (await hidQuery(0x0c))[1];
    const sz = await hidQuery(0x0d); edit.macroSize = (sz[1] << 8) | sz[2];
    const bytes = [];
    for (let off = 0; edit.macroCount && off < edit.macroSize; off += 28) {
      const n = Math.min(28, edit.macroSize - off);
      const d = await hidQuery(0x0e, off >> 8, off & 0xff, n);
      bytes.push(...d.slice(4, 4 + n));
    }
    edit.macros = parseMacroBytes(bytes, edit.macroCount);
    edit.draft = clone(edit.macros);
    edit.original = { keymap: clone(edit.keymap), enc: clone(edit.enc), macros: clone(edit.macros) };
    edit.undo = []; edit.layer = Math.min(edit.layer, layers - 1);
    PICKER.find(p => p[0] === 'Layers')[1] = Object.keys(LAYER_LABEL).flatMap(fn => range(0, layers - 1).map(n => LAYER_FNS[fn] + n));
    PICKER.find(p => p[0] === 'Macros')[1] = range(0, edit.macroCount - 1).map(n => QK_MACRO + n);
    edit.ready = true;
  }
  // the tester's key-event bindings follow the npad's base layer
  function relearnMap() {
    if (!edit.ready) return;
    INPUTS.forEach(i => { const sig = qmkToSig(getCode(0, i.id)); if (sig) map[i.id] = sig; else delete map[i.id]; });
    save();
  }

  // ---- writing: each change is an op that can be undone ----
  async function writeOp(op, value) {
    if (op.kind === 'mx') {
      await hidQuery(0x05, op.layer, Math.floor(op.idx / 3), op.idx % 3, value >> 8, value & 0xff);
      edit.keymap[op.layer][op.idx] = value;
    } else if (op.kind === 'enc') {
      await hidQuery(0x15, op.layer, 0, op.cw, value >> 8, value & 0xff);
      edit.enc[op.layer][op.cw] = value;
    } else if (op.kind === 'macros') {
      await writeMacros(value);
    }
  }
  let editQueue = Promise.resolve();
  function runEdit(fn) {                                        // one change at a time; failures become a toast
    editQueue = editQueue.then(fn).catch(err => toast(`Couldn't write to the npad: ${err?.message || err}`, 'warn', 7000));
    return editQueue;
  }
  function opFor(layer, id, to) {
    const i = byId[id], from = getCode(layer, id);
    return i.pos ? { kind: 'mx', layer, idx: idxOf(i), from, to } : { kind: 'enc', layer, cw: id === 'cw' ? 1 : 0, from, to };
  }
  function afterEdit() { relearnMap(); renderEditor(); render(); }
  function setCode(layer, id, code) {
    return runEdit(async () => {
      if (!hidDev || !id || getCode(layer, id) === code) return;
      const op = opFor(layer, id, code);
      await writeOp(op, code);
      edit.undo.push([op]);
      afterEdit();
    });
  }
  function undo() {
    return runEdit(async () => {
      const ops = edit.undo.pop();
      if (!ops) return;
      for (const op of ops.slice().reverse()) await writeOp(op, op.from);
      if (ops.some(o => o.kind === 'macros')) edit.draft = clone(edit.macros);
      afterEdit(); toast('Undone.');
    });
  }
  function restoreOriginal() {
    return runEdit(async () => {
      const o = edit.original, ops = [];
      o.keymap.forEach((layer, l) => layer.forEach((to, idx) => { const from = edit.keymap[l][idx]; if (from !== to) ops.push({ kind: 'mx', layer: l, idx, from, to }); }));
      o.enc.forEach((pair, l) => pair.forEach((to, cw) => { const from = edit.enc[l][cw]; if (from !== to) ops.push({ kind: 'enc', layer: l, cw, from, to }); }));
      if (JSON.stringify(o.macros) !== JSON.stringify(edit.macros)) ops.push({ kind: 'macros', from: clone(edit.macros), to: clone(o.macros) });
      const lit = await restoreLighting();
      if (!ops.length) { toast(lit ? 'Restored the lighting from when you connected.' : 'Nothing to restore: the npad is as it was when you connected.'); return; }
      for (const op of ops) await writeOp(op, op.to);
      edit.draft = clone(edit.macros);
      edit.undo.push(ops); afterEdit(); toast('Restored the layout from when you connected.');
    });
  }

  // ---- macros: QMK dynamic macro buffer (VIA protocol 11+) ----
  // In the buffer, macros are NUL-terminated; plain bytes are typed as text, and 0x01 starts an action:
  // 01 01 kc = tap, 01 02 kc = press, 01 03 kc = release, 01 04 <digits> '|' = wait in ms.
  // In the editor a macro is a list of steps: text, key (a tap, with optional modifiers held), hold,
  // release, wait.
  function parseMacroBytes(bytes, count) {
    const out = []; let cur = [], i = 0;
    while (i < bytes.length && out.length < count) {
      const b = bytes[i];
      if (b === 0) { out.push(foldChords(cur)); cur = []; }
      else if (b === 1) {
        const a = bytes[++i];
        if (a >= 1 && a <= 3) cur.push({ t: ['', 'tap', 'down', 'up'][a], key: KC_NAME[bytes[++i]] || 'KC_NO' });
        else if (a === 4) { let s = ''; while (++i < bytes.length && bytes[i] !== 124) s += String.fromCharCode(bytes[i]); cur.push({ t: 'wait', ms: parseInt(s, 10) || 0 }); }
      } else {
        const ch = String.fromCharCode(b), last = cur[cur.length - 1];
        if (last && last.t === 'text') last.v += ch; else cur.push({ t: 'text', v: ch });
      }
      i++;
    }
    while (out.length < count) out.push([]);
    return out;
  }
  function foldChords(seq) {                                    // press mods, tap a key, release mods -> one key step
    const out = [];
    for (let i = 0; i < seq.length; i++) {
      const s = seq[i];
      if (s.t === 'tap') { out.push({ t: 'key', key: s.key, mods: [] }); continue; }
      if (s.t === 'down' && MOD_KEYS.includes(s.key)) {
        let j = i; const mods = [];
        while (seq[j]?.t === 'down' && MOD_KEYS.includes(seq[j].key)) mods.push(seq[j++].key);
        let key = null;
        if (seq[j]?.t === 'tap') { key = seq[j].key; j++; }
        else if (seq[j]?.t === 'down' && seq[j + 1]?.t === 'up' && seq[j + 1].key === seq[j].key) { key = seq[j].key; j += 2; }
        const ups = mods.slice().reverse();
        if (key && ups.every((m, x) => seq[j + x]?.t === 'up' && seq[j + x].key === m)) { out.push({ t: 'key', key, mods }); i = j + ups.length - 1; continue; }
      }
      out.push({ ...s });
    }
    return out;
  }
  function macroToBytes(steps) {
    const b = [], act = (a, name) => b.push(1, a, KC[name] ?? 0);
    for (const s of steps) {
      if (s.t === 'text') { for (const ch of s.v) { const c = ch.charCodeAt(0); if ((c >= 32 && c < 127) || c === 10 || c === 9) b.push(c); } }
      else if (s.t === 'key') { s.mods.forEach(m => act(2, m)); act(1, s.key); s.mods.slice().reverse().forEach(m => act(3, m)); }
      else if (s.t === 'down') act(2, s.key);
      else if (s.t === 'up') act(3, s.key);
      else if (s.t === 'wait') b.push(1, 4, ...String(Math.max(0, Math.min(9999, s.ms | 0))).split('').map(c => c.charCodeAt(0)), 124);

  }
  const macroBytesUsed = macros => macros.reduce((n, m) => n + macroToBytes(m).length, 0);
  async function writeMacros(macros) {
    const bytes = macros.flatMap(macroToBytes);
    if (bytes.length > edit.macroSize) throw new Error(`the macros need ${bytes.length} bytes and the npad has room for ${edit.macroSize}`);
    const last = edit.macroSize - 1;
    await hidQuery(0x10);                                       // clear, then mark "write in progress" like VIA does
    await hidQuery(0x0f, last >> 8, last & 0xff, 1, 0xff);
    try {
      for (let off = 0; off < bytes.length; off += 28) {
        const chunk = bytes.slice(off, off + 28);
        await hidQuery(0x0f, off >> 8, off & 0xff, chunk.length, ...chunk);

  }
  // VIA's text form, used in layout files: text, {KC_A}, {KC_LGUI,KC_S}, {+KC_X}, {-KC_X}, {100}
  function macroToExpression(steps) {
    return steps.map(s => s.t === 'text' ? s.v.replace(/{/g, '\\{') : s.t === 'key' ? `{${[...s.mods, s.key].join(',')}}`
      : s.t === 'down' ? `{+${s.key}}` : s.t === 'up' ? `{-${s.key}}` : `{${s.ms}}`).join('');
  }
  function expressionToMacro(str) {
    const out = [];

        const inner = p.slice(1, -1).replace(/\s+/g, '');
        if (/^\d+$/.test(inner)) out.push({ t: 'wait', ms: +inner });
        else if (/^[+-]/.test(inner)) out.push({ t: inner[0] === '+' ? 'down' : 'up', key: inner.slice(1).toUpperCase() });
        else {
          const keys = inner.split(',').filter(Boolean).map(x => x.toUpperCase()), key = keys.pop();
          if (!key) continue;
          if (keys.every(x => MOD_KEYS.includes(x))) out.push({ t: 'key', key, mods: keys });
          else { [...keys, key].forEach(x => out.push({ t: 'down', key: x })); [...keys, key].reverse().forEach(x => out.push({ t: 'up', key: x })); }
        }
      } else out.push({ t: 'text', v: p.replace(/\\{/g, '{') });
    }
    return out;
  }
  // edits to the draft are written to the npad after a short pause (each save is one undo step)
  function macroChanged() {
    edit.macroState = 'Saving…'; renderMacroMeta();
    clearTimeout(edit.macroTimer);
    edit.macroTimer = setTimeout(() => runEdit(async () => {
      if (JSON.stringify(edit.draft) === JSON.stringify(edit.macros)) { edit.macroState = 'Saved to npad'; renderMacroMeta(); return; }
      if (macroBytesUsed(edit.draft) > edit.macroSize) { edit.macroState = 'Too long to save'; renderMacroMeta(); return; }
      const op = { kind: 'macros', from: clone(edit.macros), to: clone(edit.draft) };
      await writeMacros(op.to);
      edit.undo.push([op]);
      edit.macroState = 'Saved to npad'; renderMacroMeta(); renderKeymap();
    }), 700);
  }

  // ---- VIA layout files ----
  const vendorProductId = () => hidDev.vendorId * 65536 + hidDev.productId;
  function saveLayoutFile() {
    if (!edit.ready) return;
    const file = {
      name: hidDev.productName || 'npad',
      vendorProductId: vendorProductId(),
      macros: edit.macros.map(macroToExpression),
      layers: edit.keymap.map(l => l.map(codeToVia)),
      encoders: [edit.enc.map(([ccw, cw]) => [codeToVia(ccw), codeToVia(cw)])],
    };
    const blob = new Blob([JSON.stringify(file, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${file.name.replace(/[^a-z0-9]+/gi, '_').toLowerCase()}.layout.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Layout saved.');
  }
  function loadLayoutFile(file) {
    return runEdit(async () => {
      let data;
      try { data = JSON.parse(await file.text()); } catch { toast("That file couldn't be read as a layout.", 'warn'); return; }
      if (!data || !Array.isArray(data.layers) || !data.vendorProductId) { toast("That file isn't a VIA layout.", 'warn'); return; }
      if (data.vendorProductId !== vendorProductId()) { toast(`That layout is for a different keyboard${data.name ? ` (${data.name})` : ''}.`, 'warn'); return; }
      if (data.layers.length > edit.layers || data.layers.some(l => !Array.isArray(l) || l.length !== 9)) { toast("That layout doesn't match the npad's keys.", 'warn'); return; }
      const ops = [];
      data.layers.forEach((layer, l) => layer.forEach((name, idx) => {
        const to = viaToCode(name), from = edit.keymap[l][idx];
        if (to != null && to !== from) ops.push({ kind: 'mx', layer: l, idx, from, to });
      }));
      (data.encoders?.[0] || []).forEach((pair, l) => l < edit.layers && pair.forEach((name, cw) => {
        const to = viaToCode(name), from = edit.enc[l][cw];
        if (to != null && to !== from) ops.push({ kind: 'enc', layer: l, cw, from, to });
      }));
      if (Array.isArray(data.macros) && edit.macroCount) {
        const next = Array.from({ length: edit.macroCount }, (_, i) => expressionToMacro(data.macros[i]));
        if (JSON.stringify(next) !== JSON.stringify(edit.macros)) ops.push({ kind: 'macros', from: clone(edit.macros), to: next });
      }
      if (!ops.length) { toast('That layout is already on the npad.'); return; }
      for (const op of ops) await writeOp(op, op.to);
      edit.draft = clone(edit.macros);
      edit.undo.push(ops); afterEdit();
      toast(`Loaded ${data.name || 'the layout'} onto the npad.`);
    });
  }

  // ---- editor UI ----
  function renderEditor() { renderKeymap(); renderMacros(); }

  function renderKeymap() {
    if (!edit.ready) return;
    // the selected layer follows the npad: switching layers on the device switches it here
    $('#layer-seg').innerHTML = range(0, edit.layers - 1).map(l =>
      `<button type="button" data-layer="${l}" aria-pressed="${l === edit.layer}">${l}</button>`).join('');
    const cur = edit.ctrl ? getCode(edit.layer, edit.ctrl) : null;
    $('#pick-title').textContent = edit.ctrl ? byId[edit.ctrl].name : 'Keys';
    $('#pick-current').textContent = !edit.ctrl ? '' : edit.layer ? `Layer ${edit.layer}: ${labelFor(cur)}` : labelFor(cur);
    $('#pick-cats').innerHTML = PICKER.filter(([, codes]) => codes.length).map(([name]) =>
      `<button type="button" data-cat="${name}" aria-pressed="${!edit.query && name === edit.cat}">${name}</button>`).join('');
    $('#pick-mods').querySelectorAll('[data-mod]').forEach(b => b.setAttribute('aria-pressed', String(!!(edit.mods & +b.dataset.mod))));
    const q = edit.query.trim().toLowerCase();
    const codes = q ? [...new Set(PICKER.flatMap(([, cs]) => cs))].filter(c => labelFor(c).toLowerCase().includes(q) || codeToVia(c).toLowerCase().includes(q))
      : (PICKER.find(([n]) => n === edit.cat)?.[1] || []);
    const withMods = c => edit.mods && c <= 0xff && c > 0x03 && !(c >= 0xe0 && c <= 0xe7) ? (edit.mods << 8) | c : c;
    renderFlags();
    if (!edit.ctrl) return;
    $('#pick-keys').innerHTML = codes.length ? codes.map(c => {
      const code = withMods(c), macro = c >= QK_MACRO && c <= 0x777f ? macroPreview(c - QK_MACRO) : '';
      return `<button type="button" class="key" data-code="${code}" aria-pressed="${code === cur}" title="${esc(codeToVia(code))}">${esc(labelFor(code))}${macro ? `<small>${esc(macro)}</small>` : ''}</button>`;
    }).join('') : '<p class="muted">No keys match.</p>';
  }

  // a small chevron between a control and what it's mapped to: [icon] › [mapping]
  const FLAG_ARROW = '<svg class="flag-arrow" viewBox="0 0 8 12" width="6" height="9" aria-hidden="true"><path d="M2 1.5 6.5 6 2 10.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // A mapping as keycaps: a shortcut is split into one cap per modifier and one for the key,
  // joined with "+" (⌘⇧S → [⌘] + [⇧] + [S]); anything else is a single cap.
  function chordCaps(code) {
    const caps = [];
    if (code >= 0x0100 && code <= 0x1fff) { const { mods, key } = chordParts(code); caps.push(...mods, key); }
    else caps.push(labelFor(code));
    return `<span class="flag-keys" aria-label="${esc(labelFor(code))}">${caps.map(c => `<span class="flag-code">${esc(c)}</span>`).join('<span class="flag-plus" aria-hidden="true">+</span>')}</span>`;
  }

  // ---- record mode: the selected control takes the next key or shortcut pressed ----
  const CODE_TO_KC = (() => {
    const m = {};
    for (let i = 0; i < 26; i++) m['Key' + String.fromCharCode(65 + i)] = 0x04 + i;
    for (let i = 1; i <= 9; i++) m['Digit' + i] = 0x1d + i;
    m.Digit0 = 0x27;
    for (let i = 1; i <= 12; i++) m['F' + i] = 0x39 + i;
    for (let i = 13; i <= 24; i++) m['F' + i] = 0x5b + i;
    Object.assign(m, { Enter: 0x28, Escape: 0x29, Backspace: 0x2a, Tab: 0x2b, Space: 0x2c, Minus: 0x2d, Equal: 0x2e,
      BracketLeft: 0x2f, BracketRight: 0x30, Backslash: 0x31, Semicolon: 0x33, Quote: 0x34, Backquote: 0x35, Comma: 0x36,
      Period: 0x37, Slash: 0x38, CapsLock: 0x39, PrintScreen: 0x46, ScrollLock: 0x47, Pause: 0x48, Insert: 0x49, Home: 0x4a,
      PageUp: 0x4b, Delete: 0x4c, End: 0x4d, PageDown: 0x4e, ArrowRight: 0x4f, ArrowLeft: 0x50, ArrowDown: 0x51, ArrowUp: 0x52,
      NumLock: 0x53, NumpadDivide: 0x54, NumpadMultiply: 0x55, NumpadSubtract: 0x56, NumpadAdd: 0x57, NumpadEnter: 0x58,
      Numpad1: 0x59, Numpad2: 0x5a, Numpad3: 0x5b, Numpad4: 0x5c, Numpad5: 0x5d, Numpad6: 0x5e, Numpad7: 0x5f, Numpad8: 0x60,
      Numpad9: 0x61, Numpad0: 0x62, NumpadDecimal: 0x63, IntlBackslash: 0x64, ContextMenu: 0x65, NumpadEqual: 0x67,
      AudioVolumeMute: 0xa8, AudioVolumeUp: 0xa9, AudioVolumeDown: 0xaa, MediaTrackNext: 0xab, MediaTrackPrevious: 0xac,
      MediaStop: 0xad, MediaPlayPause: 0xae,
      ControlLeft: 0xe0, ShiftLeft: 0xe1, AltLeft: 0xe2, MetaLeft: 0xe3, ControlRight: 0xe4, ShiftRight: 0xe5, AltRight: 0xe6, MetaRight: 0xe7 });
    return m;
  })();
  const recording = () => !!(edit.ctrl && flagsOn());
  let lonelyMod = null;                             // a modifier pressed on its own: recorded when it's released alone
  function recordCode(code) {
    const id = edit.ctrl;
    pick(null);
    setCode(edit.layer, id, code).then(() => flashFlag(id));
  }
  window.addEventListener('keydown', e => {
    if (!recording() || inField(e)) return;
    e.preventDefault(); e.stopImmediatePropagation();  // the page's tester doesn't see keys while recording
    if (e.repeat) return;
    if (e.key === 'Escape' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey) { pick(null); return; }
    const kc = CODE_TO_KC[e.code];
    if (kc == null) { toast(`That key can't be recorded here. Use More to pick it.`); return; }
    if (kc >= 0xe0) { lonelyMod = e.code; return; }
    lonelyMod = null;
    const mods = (e.ctrlKey ? 1 : 0) | (e.shiftKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0);
    recordCode(mods && kc <= 0xa4 ? (mods << 8) | kc : kc);
  }, true);

    if (!recording() || inField(e)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (lonelyMod && e.code === lonelyMod) { lonelyMod = null; recordCode(CODE_TO_KC[e.code]); }
  }, true);

  // ---- search: the recording field filters every keycode by name; ↑/↓ choose, Enter maps ----
